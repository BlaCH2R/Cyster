<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; media-src blob:; font-src 'self' data:; connect-src 'self'">
  <title>Cyster 使用手册</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #14171c; }
    #manualToolbar {
      display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      border-bottom: 1px solid #262b33; background: #1a1e24;
      user-select: none; flex: none;
    }
    #manualToolbar .mt-title { font-size: 13px; font-weight: 600; color: #d7dee8; margin-right: 8px; }
    #manualToolbar .mt-zoom { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    #manualZoomPct { min-width: 52px; text-align: center; font-size: 12px; color: #9aa7b5; }
    #manualStatus { font-size: 12px; color: #8b97a5; }
    #manualBody {
      height: calc(100% - 41px); overflow: auto; padding: 18px 24px;
      background: #171b21;
    }
    #docxContainer {
      margin: 0 auto; background: #fff; color: #000;
      box-shadow: 0 2px 12px rgba(0,0,0,.45); border-radius: 2px;
      min-height: 96%; width: 820px;
      transform-origin: top center;
    }
    #docxContainer .docx-wrapper { padding: 0 !important; background: #fff !important; }
    .mini-btn { cursor: pointer; }
    #docxContainer .toc-jump { cursor: pointer; }
    #docxContainer .toc-jump:hover { color: #5bc0eb !important; text-decoration: underline; }
    #docxContainer .toc-target-flash { background: rgba(91, 192, 235, 0.20) !important; transition: background 0.6s; }
  </style>
</head>
<body>
  <div id="manualToolbar">
    <span class="mt-title">Cyster 使用手册</span>
    <span id="manualStatus">加载中…</span>
    <span class="mt-zoom">
      <button class="mini-btn" id="btnZoomOut" title="缩小">−</button>
      <span id="manualZoomPct">100%</span>
      <button class="mini-btn" id="btnZoomIn" title="放大">+</button>
      <button class="mini-btn" id="btnZoomFit" title="适应宽度">适应宽度</button>
      <button class="mini-btn" id="btnZoom100" title="实际大小">100%</button>
    </span>
  </div>
  <div id="manualBody"><div id="docxContainer"></div></div>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/docx-preview.min.js"></script>
  <script src="manual_textbox_flat.js"></script>
  <script src="manual.js"></script>
</body>
</html>
