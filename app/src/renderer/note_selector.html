<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'">
  <title>Note 选择器编辑器</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { padding: 8px 10px; overflow: auto; }
    #nsApp .field { margin-bottom: 5px; }
    #nsApp .field label { width: 88px; }
    .ns-types { display: flex; flex-wrap: wrap; gap: 2px 8px; flex: 1; font-size: 11px; }
    .ns-types label { display: inline-flex; align-items: center; gap: 2px; }
    .btn-row { margin-top: 8px; }
    #nsList { max-height: 300px; overflow-y: auto; flex: 1; border: 1px solid #333;
      border-radius: 4px; padding: 4px; font-size: 12px; }
    .ns-list-item { display: flex; justify-content: space-between; gap: 8px;
      padding: 2px 4px; }
    .ns-list-item:nth-child(odd) { background: rgba(255,255,255,0.04); }
    .ns-list-type { color: var(--accent); }
  </style>
</head>
<body>
  <div id="nsApp">
    <div class="help-text" id="nsStatus" data-i18n="加载中…">加载中…</div>
    <div id="nsFilterArea">
      <div class="field"><label data-i18n="类型">类型</label><div class="ns-types" id="nsTypes"></div></div>
      <div class="field"><label data-i18n="ID 从">ID 从</label><input type="number" id="nsStart" data-i18n-attr="placeholder" data-i18n="不限" placeholder="不限"></div>
      <div class="field"><label data-i18n="ID 到">ID 到</label><input type="number" id="nsEnd" data-i18n-attr="placeholder" data-i18n="不限" placeholder="不限"></div>
      <div class="field"><label data-i18n="方向">方向</label><select id="nsDir">
        <option value="" data-i18n="不限">不限</option><option value="1" data-i18n="上行 (1)">上行 (1)</option><option value="-1" data-i18n="下行 (-1)">下行 (-1)</option>
      </select></div>
      <div class="field"><label>min_X</label><input type="number" id="nsMinX" step="0.01" data-i18n-attr="placeholder" data-i18n="不限" placeholder="不限"></div>
      <div class="field"><label>max_X</label><input type="number" id="nsMaxX" step="0.01" data-i18n-attr="placeholder" data-i18n="不限" placeholder="不限"></div>
      <div class="field"><label data-i18n="命中数量">命中数量</label><span id="nsHit" style="color:var(--accent)">-</span></div>
    </div>
    <div class="field" id="nsListRow" style="display:none">
      <label data-i18n="已选 note">已选 note</label>
      <div id="nsList"></div>
    </div>
    <div class="field" id="nsMergeRow"><label data-i18n="合并时间块">合并时间块</label><input type="checkbox" id="nsMerge"></div>
    <div class="field" id="nsTimeRow" style="display:none">
      <label data-i18n="写入时间">写入时间</label>
      <select id="nsTimeExpr">
        <option value="start:$note" data-i18n="起始 start:$note">起始 start:$note</option>
        <option value="end:$note" data-i18n="结束 end:$note">结束 end:$note</option>
        <option value="intro:$note" data-i18n="渐入 intro:$note">渐入 intro:$note</option>
        <option value="at:$note:0.5">at:$note:0.5</option>
      </select>
      <button class="mini-btn" id="nsWriteTime" data-i18n="写入">写入</button>
    </div>
    <div class="btn-row">
      <button class="mini-btn" id="nsApply" data-i18n="应用">应用</button>
      <button class="mini-btn" id="nsToggleAll" data-i18n="全选/清空条件">全选/清空条件</button>
      <button class="mini-btn" id="nsPick" data-i18n="手动拾取note">手动拾取note</button>
      <button class="mini-btn" id="nsToFilter" style="display:none" data-i18n="切换至筛选样式并清空列表">切换至筛选样式并清空列表</button>
    </div>
  </div>
  <script src="vendor/opencc.js"></script>
  <script src="i18n_dict.js"></script>
  <script src="i18n.js"></script>
  <script src="note_selector_tool.js"></script>
</body>
</html>
