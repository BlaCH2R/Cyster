<!doctype html>
<html>
<head><meta charset="utf-8"><title>field tip probe</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/schema.js"></script>
<script>
  try {
    const out = { results: {} };
    const container = document.createElement('div');
    document.body.appendChild(container);
    const schema = window.SBSchema.SCHEMAS.note_controller;
    const state = { dy: 0.3, dx: 0.1, note: 1, y: 2 };
    window.SBSchema.renderForm(container, schema, state, () => {}, false, {});
    const rows = [...container.querySelectorAll('.field')];
    const dyRow = rows.find((r) => r.querySelector('label') &&
      r.querySelector('label').textContent.indexOf('Y 偏移') === 0);
    const dxRow = rows.find((r) => r.querySelector('label') &&
      r.querySelector('label').textContent.indexOf('X 偏移') === 0);
    out.results.dyRowFound = !!dyRow;
    out.results.dxRowFound = !!dxRow;
    const dyTip = dyRow ? dyRow.querySelector('.field-tip') : null;
    out.results.dyTipIcon = !!dyTip;
    out.results.dxHasNoTipIcon = dxRow ? !dxRow.querySelector('.field-tip') : null;
    out.results.dyLabelText = dyRow ? dyRow.querySelector('label').textContent : null;
    if (dyTip) {
      dyTip.dispatchEvent(new MouseEvent('mouseenter', { bubbles: false }));
      const pop = document.querySelector('.field-tip-pop');
      out.results.popupVisible = !!pop && pop.style.display === 'block';
      out.results.popupText = pop ? pop.textContent : null;
      dyTip.dispatchEvent(new MouseEvent('mouseleave', { bubbles: false }));
      out.results.popupHiddenAfterLeave = !pop || pop.style.display === 'none';
    }
    // 独立场景（设置面板按钮旁）直接调用 API 也能弹窗/收起。
    const standalone = document.createElement('span');
    standalone.className = 'field-tip';
    standalone.textContent = 'i';
    document.body.appendChild(standalone);
    window.SBSchema.showFieldTip(standalone, '独立提示文本');
    const pop2 = document.querySelector('.field-tip-pop');
    out.results.standaloneApiShows = !!pop2 && pop2.style.display === 'block' &&
      pop2.textContent === '独立提示文本';
    window.SBSchema.hideFieldTip();
    out.results.standaloneApiHides = !pop2 || pop2.style.display === 'none';
    out.ok = out.results.dyRowFound && out.results.dyTipIcon &&
      out.results.dxHasNoTipIcon === true && out.results.popupVisible &&
      out.results.popupText === '对于下行的note，您应当在原本的偏移值上+1来实现预期效果（这是一个原生bug）' &&
      out.results.popupHiddenAfterLeave && out.results.standaloneApiShows &&
      out.results.standaloneApiHides;
    fs.writeFileSync(path.join(__dirname, 'probe_field_tip_out.json'),
      JSON.stringify(out, null, 2));
  } catch (err) {
    fs.writeFileSync(path.join(__dirname, 'probe_field_tip_out.json'),
      JSON.stringify({ ok: false, error: String(err && err.stack || err) }, null, 2));
  }
  window.close();
</script>
</body>
</html>
