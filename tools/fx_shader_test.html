<!doctype html>
<html>
<head><meta charset="utf-8"><title>fx shader test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/renderer/effects.js"></script>
<script>
  try {
    const out = {};
    function mk(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#888';
      ctx.fillRect(0, 0, w, h);
      return { c, ctx };
    }
    const px = (ctx, w, x, y) => {
      const d = ctx.getImageData(x, y, 1, 1).data;
      return [d[0], d[1], d[2]];
    };
    function run(name, eff, setup) {
      const { c, ctx } = mk(160, 120);
      if (setup) setup(ctx);
      const before = c.toDataURL();
      window.SBEffects.applyEffects(ctx, c, 160, 120, eff, 1.5);
      out[name] = {
        glUsed: window.SBGlUsed,
        changed: before !== c.toDataURL(),
        center: px(ctx, 160, 80, 60),
        corner: px(ctx, 160, 6, 6),
      };
    }
    run('shockwave', { shockwave: true, shockwave_speed: 1 });
    run('focus', { focus: true, focus_intensity: 0.25, focus_size: 1, focus_speed: 5, focus_color: { r: 1, g: 1, b: 1, a: 1 } });
    run('arcade', { arcade: true, arcade_intensity: 1, arcade_interference_size: 1, arcade_interference_speed: 0.5, arcade_contrast: 1 });

    // Negative intensities must produce a visible (opposite) effect, not a no-op.
    const neg = {};
    const negCheck = (name, eff) => {
      const { c, ctx } = mk(160, 120);
      // Colorful test pattern so direction-sensitive filters show changes.
      ctx.fillStyle = '#e33'; ctx.fillRect(0, 0, 80, 60);
      ctx.fillStyle = '#3e3'; ctx.fillRect(80, 0, 80, 60);
      ctx.fillStyle = '#33e'; ctx.fillRect(0, 60, 80, 60);
      ctx.fillStyle = '#ee3'; ctx.fillRect(80, 60, 80, 60);
      ctx.fillStyle = '#fff'; ctx.fillRect(72, 52, 16, 16);
      const before = c.toDataURL();
      window.SBEffects.applyEffects(ctx, c, 160, 120, eff, 1.5);
      neg[name] = { changed: before !== c.toDataURL(), glUsed: window.SBGlUsed };
    };
    negCheck('arcade', { arcade: true, arcade_intensity: -1, arcade_interference_size: 1, arcade_interference_speed: 0.5, arcade_contrast: 1 });
    negCheck('glitch', { glitch: true, glitch_intensity: -1 });
    negCheck('chromatical', { chromatical: true, chromatical_intensity: -1, chromatical_fade: -1 });
    negCheck('bloom', { bloom: true, bloom_intensity: -1.5 });
    negCheck('dream', { dream: true, dream_intensity: -1 });
    negCheck('noise', { noise: true, noise_intensity: -0.3 });
    negCheck('gray', { gray_scale: true, gray_scale_intensity: -1 });
    negCheck('sepia', { sepia: true, sepia_intensity: -1 });
    negCheck('focus', { focus: true, focus_intensity: -0.25, focus_size: 1, focus_speed: 5, focus_color: { r: 1, g: 1, b: 1, a: 1 } });
    out.negative = neg;

    fs.writeFileSync(path.join(__dirname, 'probe_fx_shaders_out.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'probe_fx_shaders_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
