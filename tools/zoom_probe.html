<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; }
    #body { width: 1000px; height: 600px; padding: 18px 24px; box-sizing: border-box; overflow: auto; background: #171b21; }
    #box { margin: 0 auto; width: 794px; min-height: 500px; background: #fff; transform-origin: top center; }
  </style>
</head>
<body>
  <div id="body"><div id="box"></div></div>
  <script>
    window.__measure = () => {
      const body = document.getElementById('body');
      const box = document.getElementById('box');
      const out = [];
      for (const z of [0.5, 0.75, 1, 1.199, 1.5, 2]) {
        box.style.zoom = String(z);
        box.style.width = '794px';
        const br = body.getBoundingClientRect();
        const xr = box.getBoundingClientRect();
        const bcs = getComputedStyle(body);
        const contentLeft = br.left + parseFloat(bcs.paddingLeft);
        const contentRight = br.right - parseFloat(bcs.paddingRight);
        out.push({
          z,
          visualW: Math.round(xr.width * 100) / 100,
          layoutW: box.offsetWidth,
          leftMargin: Math.round((xr.left - contentLeft) * 100) / 100,
          rightGap: Math.round((contentRight - xr.right) * 100) / 100
        });
      }
      return out;
    };
  </script>
</body>
</html>
