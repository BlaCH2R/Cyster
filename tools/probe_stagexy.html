<!doctype html>
<html>
<head><meta charset="utf-8"><title>stage xy probe</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  (async () => {
    try {
      const out = { checks: [], ok: true };
      const W = 960, H = 540;
      const check = (name, cond, detail) => {
        out.checks.push({ name, pass: !!cond, detail: String(detail) });
        if (!cond) out.ok = false;
      };
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const pv = new window.SBPreview.PreviewRenderer(canvas);
      pv.chart = new window.SBEngine.chart.Chart(JSON.stringify({
        format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
        page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
        note_list: []
      }), { screenRatio: 16 / 9 });
      pv.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
        sprites: [
          { id: 'c', x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' }, states: [{ time: 0, opacity: 1 }] },
          { id: 'tr', x: { value: 400, unit: 'stagex' }, y: { value: 300, unit: 'stagey' }, states: [{ time: 0, opacity: 1 }] },
          { id: 'bl', x: { value: -400, unit: 'stagex' }, y: { value: -300, unit: 'stagey' }, states: [{ time: 0, opacity: 1 }] },
          { id: 'mid', x: { value: 200, unit: 'stagex' }, y: { value: 150, unit: 'stagey' }, states: [{ time: 0, opacity: 1 }] },
        ],
      }, pv.chart).compile();
      pv.evaluate(0.5);
      const info = pv.ctxInfo();
      const pos = (id) => {
        const r = (pv.evalResult.sprites || []).find((s) => s.obj.id === id);
        const m = pv.stageMatrix(r.obj, r, info);
        return { x: m.e, y: m.f };
      };
      const pC = pos('c'), pTR = pos('tr'), pBL = pos('bl'), pM = pos('mid');
      out.positions = { center: pC, topRight: pTR, bottomLeft: pBL, mid: pM };
      // Doc semantics: stageX:0/Y:0 = canvas center (W/2,H/2);
      // stageX:400/Y:300 = top-right corner (W,0); stageX:-400/Y:-300 = bottom-left (0,H);
      // stageX:200/Y:150 = 1/4 right of center and 1/4 up.
      check('stage 0,0 at canvas center',
        Math.abs(pC.x - W / 2) < 1 && Math.abs(pC.y - H / 2) < 1, `(${pC.x.toFixed(1)},${pC.y.toFixed(1)})`);
      check('stage 400,300 at top-right corner',
        Math.abs(pTR.x - W) < 1 && Math.abs(pTR.y - 0) < 1, `(${pTR.x.toFixed(1)},${pTR.y.toFixed(1)})`);
      check('stage -400,-300 at bottom-left corner',
        Math.abs(pBL.x - 0) < 1 && Math.abs(pBL.y - H) < 1, `(${pBL.x.toFixed(1)},${pBL.y.toFixed(1)})`);
      check('stage 200,150 at quarter offset',
        Math.abs(pM.x - (W / 2 + W / 4)) < 1 && Math.abs(pM.y - (H / 2 - H / 4)) < 1,
        `(${pM.x.toFixed(1)},${pM.y.toFixed(1)}) expected (${(W / 2 + W / 4).toFixed(1)},${(H / 2 - H / 4).toFixed(1)})`);
      // Sizes: width 200 stagex = 1/4 canvas width; height 150 stagey = 1/4 canvas height.
      const rw = pv.evalResult.sprites.find((s) => s.obj.id === 'mid');
      const w = pv.stageUnitPx({ value: 200, unit: 'stagex' }, info, true);
      const h = pv.stageUnitPx({ value: 150, unit: 'stagey' }, info, true);
      out.sizes = { w, h };
      check('stage size 200x150 maps to 1/4 canvas',
        Math.abs(w - W / 4) < 1 && Math.abs(h - H / 4) < 1, `w=${w.toFixed(1)} h=${h.toFixed(1)}`);

      // Parented child: its stageX/stageY should be LOCAL to the parent
      // (Unity RectTransform hierarchy), so a child at 200,150 under a parent
      // at 0,0 lands 240px right / 135px up from the parent's center.
      const pv2 = new window.SBPreview.PreviewRenderer(canvas);
      pv2.chart = pv.chart;
      pv2.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
        sprites: [
          { id: 'p', x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' }, states: [{ time: 0, opacity: 1 }] },
          { id: 'ch', parent_id: 'p', x: { value: 200, unit: 'stagex' }, y: { value: 150, unit: 'stagey' }, states: [{ time: 0, opacity: 1 }] },
        ],
      }, pv2.chart).compile();
      pv2.evaluate(0.5);
      const info2 = pv2.ctxInfo();
      const pos2 = (id) => {
        const r = (pv2.evalResult.sprites || []).find((s) => s.obj.id === id);
        const m = pv2.stageMatrix(r.obj, r, info2);
        return { x: m.e, y: m.f };
      };
      const pP = pos2('p'), pCh = pos2('ch');
      out.parented = { parent: pP, child: pCh, rel: { dx: pCh.x - pP.x, dy: pCh.y - pP.y } };
      check('parented child offset is local to the parent',
        Math.abs((pCh.x - pP.x) - W / 4) < 1 && Math.abs((pCh.y - pP.y) + H / 4) < 1,
        `child=(${pCh.x.toFixed(1)},${pCh.y.toFixed(1)}) parent=(${pP.x.toFixed(1)},${pP.y.toFixed(1)}) rel=(${(pCh.x - pP.x).toFixed(1)},${(pCh.y - pP.y).toFixed(1)})`);

      // Controller camera x/y: the real engine moves the camera in WORLD
      // units (scaleToCanvas=false), so the on-screen offset is
      // unitWorld * S. camerax:1 = ortho*aspect world -> value * W/2 px,
      // and a stagex prefix converts via the camera size too:
      // stagex:400 -> 400/800*ortho*aspect world -> W/4 px (NOT W/2, which
      // is the canvas-fixed scale used by sprites).
      const pv3 = new window.SBPreview.PreviewRenderer(canvas);
      pv3.chart = pv.chart;
      pv3.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
        controllers: [{ id: 'cam', x: { value: 1, unit: 'camerax' }, y: { value: 1, unit: 'cameray' }, states: [{ time: 0 }] }],
      }, pv3.chart).compile();
      pv3.evaluate(0.5);
      out.controller = { xPx: pv3.mergedCtrl && pv3.mergedCtrl.xPx, yPx: pv3.mergedCtrl && pv3.mergedCtrl.yPx };
      check('controller camerax:1 -> xPx = W/2',
        pv3.mergedCtrl && Math.abs(pv3.mergedCtrl.xPx - W / 2) < 1,
        `xPx=${pv3.mergedCtrl && pv3.mergedCtrl.xPx}`);
      check('controller cameray:1 -> yPx = H/2',
        pv3.mergedCtrl && Math.abs(pv3.mergedCtrl.yPx - H / 2) < 1,
        `yPx=${pv3.mergedCtrl && pv3.mergedCtrl.yPx}`);

      const pv3b = new window.SBPreview.PreviewRenderer(canvas);
      pv3b.chart = pv.chart;
      pv3b.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
        controllers: [{ id: 'cam', x: { value: 400, unit: 'stagex' }, y: { value: 300, unit: 'stagey' }, states: [{ time: 0 }] }],
      }, pv3b.chart).compile();
      pv3b.evaluate(0.5);
      out.controllerStage = { xPx: pv3b.mergedCtrl && pv3b.mergedCtrl.xPx, yPx: pv3b.mergedCtrl && pv3b.mergedCtrl.yPx };
      check('controller stageX:400 -> xPx = W/4 (world units)',
        pv3b.mergedCtrl && Math.abs(pv3b.mergedCtrl.xPx - W / 4) < 1,
        `xPx=${pv3b.mergedCtrl && pv3b.mergedCtrl.xPx}`);
      check('controller stageY:300 -> yPx = H/4 (world units)',
        pv3b.mergedCtrl && Math.abs(pv3b.mergedCtrl.yPx - H / 4) < 1,
        `yPx=${pv3b.mergedCtrl && pv3b.mergedCtrl.yPx}`);

      // Camera independence: a controller moving the camera X/Y must NOT move
      // a standalone stageX/stageY sprite (fixed canvas origin).
      const pv4 = new window.SBPreview.PreviewRenderer(canvas);
      pv4.chart = pv.chart;
      pv4.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
        controllers: [{ id: 'cam', x: { value: 200, unit: 'stagex' }, y: { value: 150, unit: 'stagey' }, states: [{ time: 0 }] }],
        sprites: [
          { id: 'fixed', x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' }, states: [{ time: 0, opacity: 1 }] },
        ],
      }, pv4.chart).compile();
      pv4.evaluate(0.5);
      const info4 = pv4.ctxInfo();
      const rFixed = (pv4.evalResult.sprites || []).find((s) => s.obj.id === 'fixed');
      const mFixed = pv4.stageMatrix(rFixed.obj, rFixed, info4);
      out.cameraIndep = {
        camXPx: pv4.mergedCtrl && pv4.mergedCtrl.xPx,
        fixedPos: { x: mFixed.e, y: mFixed.f },
      };
      check('stageX/Y sprite stays at canvas center when camera moves',
        Math.abs(mFixed.e - W / 2) < 1 && Math.abs(mFixed.f - H / 2) < 1,
        `pos=(${mFixed.e.toFixed(1)},${mFixed.f.toFixed(1)}) camX=${pv4.mergedCtrl && pv4.mergedCtrl.xPx}`);

      // Parent chain inheritance: the parent's opacity cascades to the child
      // (0.5 * 0.8 = 0.4) and its scale doubles the child's rendered box.
      const pv5 = new window.SBPreview.PreviewRenderer(canvas);
      pv5.chart = pv.chart;
      pv5.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
        sprites: [
          { id: 'p', opacity: 0.5, scale: 2, x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' }, states: [{ time: 0 }] },
          { id: 'ch', parent_id: 'p', opacity: 0.8, x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' }, width: { value: 100, unit: 'stagex' }, height: { value: 100, unit: 'stagey' }, states: [{ time: 0 }] },
        ],
      }, pv5.chart).compile();
      pv5.evaluate(0.5);
      const info5 = pv5.ctxInfo();
      const tt5 = document.createElement('canvas');
      tt5.width = 4; tt5.height = 4;
      const tctx5 = tt5.getContext('2d');
      tctx5.fillStyle = '#fff';
      tctx5.fillRect(0, 0, 4, 4);
      const img5 = new Image();
      img5.src = tt5.toDataURL();
      await new Promise((res) => { img5.onload = () => res(img5); img5.onerror = () => res(null); });
      pv5.imageCache['w.png'] = img5;
      const rch5 = (pv5.evalResult.sprites || []).find((s) => s.obj.id === 'ch');
      rch5.from.path = 'w.png';
      const cnv5 = document.createElement('canvas');
      cnv5.width = W; cnv5.height = H;
      const ctx5 = cnv5.getContext('2d');
      ctx5.fillStyle = '#000';
      ctx5.fillRect(0, 0, W, H);
      pv5.drawStageObject(ctx5, info5, rch5, 'sprite', 1);
      const d5 = ctx5.getImageData(0, 0, W, H).data;
      let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1, cnt = 0, lumSum = 0;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const lum = (d5[i] + d5[i + 1] + d5[i + 2]) / 3;
          if (d5[i + 3] > 20 && lum > 20) {
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
            cnt++;
            lumSum += lum;
          }
        }
      }
      const boxW = maxX - minX + 1, boxH = maxY - minY + 1;
      const avgLum = cnt ? lumSum / cnt : 0;
      out.inherit = { boxW, boxH, avgLum, cnt };
      check('child inherits parent opacity (0.5*0.8=0.4)',
        Math.abs(avgLum / 255 - 0.4) < 0.06, `avgLum=${avgLum.toFixed(1)} => ${(avgLum / 255).toFixed(3)}`);
      // The 100-unit box is preserveAspect-fitted to 90x90 px, then the
      // parent's scale 2 doubles it -> 180x180.
      check('child inherits parent scale (90 box x2 = 180px box)',
        Math.abs(boxW - 180) < 6 && Math.abs(boxH - 180) < 6,
        `box=${boxW}x${boxH}`);

      // Multi-level chain: Parent -> Child1 -> Child2. Parent's opacity,
      // scale and rotation must cascade through Child1 to Child2.
      const pv6 = new window.SBPreview.PreviewRenderer(canvas);
      pv6.chart = pv.chart;
      pv6.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
        sprites: [
          { id: 'P', opacity: 0.5, scale: 2, rot_x: 30, x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' }, states: [{ time: 0 }] },
          { id: 'C1', parent_id: 'P', opacity: 0.8, x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' }, width: { value: 100, unit: 'stagex' }, height: { value: 100, unit: 'stagey' }, states: [{ time: 0 }] },
          { id: 'C2', parent_id: 'C1', opacity: 1, x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' }, width: { value: 100, unit: 'stagex' }, height: { value: 100, unit: 'stagey' }, states: [{ time: 0 }] },
        ],
      }, pv6.chart).compile();
      pv6.evaluate(0.5);
      const info6 = pv6.ctxInfo();
      const rc2 = (pv6.evalResult.sprites || []).find((s) => s.obj.id === 'C2');
      const inhOpacity = pv6.stageInheritedOpacity(rc2.obj, rc2);
      const mC2 = pv6.stageMatrix(rc2.obj, rc2, info6);
      const pe1 = pv6.findEvalItem('C1');
      const peP = pv6.findEvalItem('P');
      out.chain = {
        inhOpacity, mC2,
        c1: pe1 ? { id: pe1.r.obj.id, parentId: pe1.r.obj.parentId, op: pe1.r.from.opacity } : null,
        p: peP ? { id: peP.r.obj.id, parentId: peP.r.obj.parentId, op: peP.r.from.opacity } : null,
      };
      check('multi-level opacity cascades (0.5*0.8*1=0.4)',
        Math.abs(inhOpacity - 0.4) < 1e-6, `inherited=${inhOpacity}`);
      // The chain matrix must contain the parent scale 2 (a ~ 2 when the
      // child box is 90 wide) and the rot_x foreshortening (d = 2*cos30).
      const cos30 = Math.cos(30 * Math.PI / 180);
      check('multi-level scale+rot_x reach the grandchild matrix',
        Math.abs(Math.abs(mC2.a) - 2) < 0.05 && Math.abs(Math.abs(mC2.d) - 2 * cos30) < 0.05,
        `a=${mC2.a.toFixed(3)} d=${mC2.d.toFixed(3)} expected a~2 d~${(2 * cos30).toFixed(3)}`);
      fs.writeFileSync(path.join(__dirname, 'probe_stagexy_out.json'), JSON.stringify(out, null, 2));
      window.close();
    } catch (e) {
      fs.writeFileSync(path.join(__dirname, 'probe_stagexy_err.txt'), String(e && e.stack || e));
      window.close();
    }
  })();
</script>
</body>
</html>
