<!doctype html>
<html>
<head><meta charset="utf-8"><title>default positions test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  (async () => {
    try {
      const out = { checks: [], ok: true };
      const W = 640, H = 360;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const pv = new window.SBPreview.PreviewRenderer(c);
      pv.chart = new window.SBEngine.chart.Chart(JSON.stringify({
        format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
        page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
        note_list: [],
      }), { screenRatio: 16 / 9 });
      const check = (name, cond, detail) => {
        out.checks.push({ name, pass: !!cond, detail });
        if (!cond) out.ok = false;
      };

      // White 100x100 test image (data URL) for the sprite.
      const mkImg = () => new Promise((resolve) => {
        const tmp = document.createElement('canvas');
        tmp.width = 100; tmp.height = 100;
        const tc = tmp.getContext('2d');
        tc.fillStyle = '#fff';
        tc.fillRect(0, 0, 100, 100);
        const im = new Image();
        im.onload = () => resolve(im);
        im.src = tmp.toDataURL('image/png');
      });

      const drawObj = (compiled, kind, id) => {
        pv.compiled = compiled;
        pv.mergedCtrl = {};
        pv.evaluate(0.5);
        const r = pv.evalResult[kind + 's'].find((x) => x.obj.id === id);
        const ctx = c.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        const info = pv.ctxInfo();
        if (kind === 'line') pv.drawLine(ctx, info, r, 1);
        else pv.drawStageObject(ctx, info, r, kind, 1);
        const img = ctx.getImageData(0, 0, W, H).data;
        let minX = -1, maxX = -1, minY = -1, maxY = -1;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            if (img[i] > 80) {
              if (minX < 0) minX = x;
              maxX = x;
              if (minY < 0) minY = y;
              maxY = y;
            }
          }
        }
        return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, minX, maxX, minY, maxY };
      };

      // Text default center (regression).
      const textCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
        texts: [{ id: 't1', states: [{ time: 0, opacity: 1, text: 'Hello', size: 40, align: 'middleCenter' }] }],
      }, pv.chart).compile();
      const tBox = drawObj(textCompiled, 'text', 't1');
      out.text = tBox;
      check('text default centered', Math.abs(tBox.cy - H / 2) < 8, `cy=${tBox.cy.toFixed(1)} Hmid=${H / 2}`);

      // Sprite default center (no x/y, 100x100 image, default 200x200 box).
      const img = await mkImg();
      const sprCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
        sprites: [{ id: 's1', path: 'test.png', states: [{ time: 0, opacity: 1 }] }],
      }, pv.chart).compile();
      pv.imageCache['test.png'] = img;
      const sBox = drawObj(sprCompiled, 'sprite', 's1');
      out.sprite = sBox;
      check('sprite default centered', Math.abs(sBox.cx - W / 2) < 8 && Math.abs(sBox.cy - H / 2) < 8,
        `cx=${sBox.cx.toFixed(1)} cy=${sBox.cy.toFixed(1)}`);

      // Sprite with explicit width/height should also be centered.
      const sprCompiled2 = new window.SBEngine.storyboard.StoryboardCompiler({
        sprites: [{ id: 's2', path: 'test.png', states: [{ time: 0, opacity: 1, width: 200, height: 100 }] }],
      }, pv.chart).compile();
      const s2Box = drawObj(sprCompiled2, 'sprite', 's2');
      out.spriteWH = s2Box;
      check('sprite w/h centered', Math.abs(s2Box.cx - W / 2) < 8 && Math.abs(s2Box.cy - H / 2) < 8,
        `cx=${s2Box.cx.toFixed(1)} cy=${s2Box.cy.toFixed(1)}`);

      // Line: default endpoints are explicit (no default offset concern), but
      // verify a line with stageX/stageY endpoints maps symmetrically.
      const lineCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
        lines: [{ id: 'l1', states: [{ time: 0, opacity: 1, pos: [
          { x: 'stagex:-100', y: 'stagey:0', z: 0 },
          { x: 'stagex:100', y: 'stagey:0', z: 0 },
        ] }] }],
      }, pv.chart).compile();
      const lBox = drawObj(lineCompiled, 'line', 'l1');
      out.line = lBox;
      check('line symmetric about center', Math.abs(lBox.cy - H / 2) < 4, `cy=${lBox.cy.toFixed(1)}`);

      // Video: default draw fills the 800x600 box (preserve_aspect default),
      // so a non-16:9 source letterboxes centered. Fake the video element with
      // a canvas (accepted by drawImage) exposing the video-style properties
      // the renderer reads.
      const vCan = document.createElement('canvas');
      vCan.width = 100; vCan.height = 100;
      const vc = vCan.getContext('2d');
      vc.fillStyle = '#fff';
      vc.fillRect(0, 0, 100, 100);
      vCan.videoWidth = 100;
      vCan.videoHeight = 100;
      vCan.readyState = 2;
      vCan.currentTime = 0;
      vCan.paused = true;
      vCan.play = () => {};
      vCan.pause = () => {};
      const vidCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
        videos: [{ id: 'v1', path: 'test.mp4', states: [{ time: 0, opacity: 1 }] }],
      }, pv.chart).compile();
      pv.videoCache['test.mp4'] = vCan;
      const vBox = drawObj(vidCompiled, 'video', 'v1');
      out.video = vBox;
      check('video default centered', Math.abs(vBox.cx - W / 2) < 8 && Math.abs(vBox.cy - H / 2) < 8,
        `cx=${vBox.cx.toFixed(1)} cy=${vBox.cy.toFixed(1)}`);

      fs.writeFileSync(path.join(__dirname, 'test_default_positions_out.json'), JSON.stringify(out, null, 2));
      window.close();
    } catch (e) {
      fs.writeFileSync(path.join(__dirname, 'test_default_positions_err.txt'), String(e && e.stack || e));
      window.close();
    }
  })();
</script>
</body>
</html>
