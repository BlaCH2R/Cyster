<!doctype html>
<html>
<head><meta charset="utf-8"><title>line + sprite test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  try {
    const out = { checks: [], ok: true };
    const W = 960, H = 540;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const pv = new window.SBPreview.PreviewRenderer(c);
    pv.chart = new window.SBEngine.chart.Chart(JSON.stringify({
      format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
      page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
      note_list: [{ page_index: 0, type: 0, id: 5, tick: 480, x: 0.5, has_sibling: false, hold_tick: 0, next_id: 0, is_forward: false, approach_rate: 1 }],
    }), { screenRatio: 16 / 9 });
    const check = (name, cond, detail) => {
      out.checks.push({ name, pass: !!cond, detail });
      if (!cond) out.ok = false;
    };

    // --- Line pos interpolation between keyframes ---
    const lineCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
      lines: [{
        id: 'line1',
        states: [
          { time: 0, opacity: 1, pos: [{ x: 'notex:0.1', y: 'notey:0.5', z: 0 }, { x: 'notex:0.9', y: 'notey:0.5', z: 0 }] },
          { time: 10, opacity: 1, pos: [{ x: 'notex:0.9', y: 'notey:0.1', z: 0 }, { x: 'notex:0.1', y: 'notey:0.9', z: 0 }] },
        ],
      }],
    }, pv.chart).compile();
    pv.compiled = lineCompiled;
    pv.mergedCtrl = {};
    pv.evaluate(5); // halfway
    const lineR = pv.evalResult.lines.find((s) => s.obj.id === 'line1');
    const p0 = lineR.from.pos[0];
    const midX = p0.x.value, midY = p0.y.value;
    // Expect interpolation between notex:0.1 and 0.9 at t=0.5 -> 0.5
    check('line pos interpolates mid X', Math.abs(midX - 0.5) < 0.01, `x=${midX}`);
    // point0: y from notey:0.5 -> notey:0.1 at t=0.5 -> 0.3
    check('line pos interpolates mid Y', Math.abs(midY - 0.3) < 0.01, `y=${midY}`);

    // --- sprite/text/video noteX/noteY are INDEPENDENT of the game camera
    // (fixed base-scale canvas mapping); LINE noteX/noteY follows the camera. ---
    const sprCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
      sprites: [{
        id: 's1',
        path: 'x.png',
        states: [{ time: 0, opacity: 1, x: 'notex:0.8', y: 'notey:0.8', width: 100, height: 100 }],
      }],
    }, pv.chart).compile();
    pv.compiled = sprCompiled;
    pv.evaluate(0.5);
    const spr = pv.evalResult.sprites.find((s) => s.obj.id === 's1');
    // Apply camera settings AFTER evaluate (evaluate rebuilds mergedCtrl).
    pv.mergedCtrl = { rot_x: -30, xPx: 0, yPx: pv.chart.convertChartYToScreenY(-0.3) * pv.ctxInfo().S };
    const info = pv.ctxInfo();
    const M = pv.stageMatrix(spr.obj, spr, info);
    const S0 = H / (2 * (pv.chart.baseSize || 5));
    const fixedX = W / 2 + pv.chart.convertChartXToScreenX(0.8) * S0;
    const fixedY = H / 2 - pv.chart.convertChartYToScreenY(0.8) * S0;
    const gx = pv.chart.convertChartXToScreenX(0.8);
    const gy = pv.chart.convertChartYToScreenY(0.8);
    const gp = pv.worldToPx(gx, gy, info);
    out.sprite = {
      M: [Number(M.e.toFixed(1)), Number(M.f.toFixed(1))],
      fixed: [Number(fixedX.toFixed(1)), Number(fixedY.toFixed(1))],
      projected: [Number(gp.x.toFixed(1)), Number(gp.y.toFixed(1))],
    };
    check('camera moves the game-space point (test is meaningful)',
      Math.abs(gp.x - fixedX) > 3 || Math.abs(gp.y - fixedY) > 3,
      `projected=${out.sprite.projected} fixed=${out.sprite.fixed}`);
    check('sprite noteX/Y independent of camera (fixed base mapping)',
      Math.abs(M.e - fixedX) < 3 && Math.abs(M.f - fixedY) < 3,
      `M=${out.sprite.M} fixed=${out.sprite.fixed}`);

    fs.writeFileSync(path.join(__dirname, 'test_line_sprite_out.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'test_line_sprite_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
