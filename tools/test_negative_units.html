<!doctype html>
<html>
<head><meta charset="utf-8"><title>negative units test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  try {
    const out = { checks: [], ok: true };
    const W = 960, H = 540;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const pv = new window.SBPreview.PreviewRenderer(c);
    pv.chart = new window.SBEngine.chart.Chart(JSON.stringify({
      format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
      page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
      note_list: [{ page_index: 0, type: 0, id: 5, tick: 480, x: 0.5, has_sibling: false, hold_tick: 0, next_id: 0, is_forward: false, approach_rate: 1 }],
    }), { screenRatio: 16 / 9 });
    const check = (name, cond, detail) => {
      out.checks.push({ name, pass: !!cond, detail });
      if (!cond) out.ok = false;
    };

    // --- Camera controller x/y in noteX/noteY units, negative values. ---
    const compileCtl = (x, y) => new window.SBEngine.storyboard.StoryboardCompiler({
      controllers: [{ id: 'cam', states: [{ time: 0, x, y }] }],
    }, pv.chart).compile();
    const evalCtl = (compiled) => {
      pv.compiled = compiled;
      pv.mergedCtrl = {};
      pv.evaluate(0.5);
      return pv.ctxInfo();
    };

    const infoNeg = evalCtl(compileCtl('notex:-0.5', 'notey:-0.5'));
    check('camera notex -0.5 -> negative xPx', pv.mergedCtrl.xPx < 0,
      `xPx=${pv.mergedCtrl.xPx}`);
    check('camera notey -0.5 -> negative yPx', pv.mergedCtrl.yPx < 0,
      `yPx=${pv.mergedCtrl.yPx}`);
    const infoPos = evalCtl(compileCtl('notex:0.5', 'notey:0.5'));
    check('camera notex 0.5 = field center (xPx ~ 0)', Math.abs(pv.mergedCtrl.xPx) < 1,
      `xPx=${pv.mergedCtrl.xPx}`);
    const infoPos8 = evalCtl(compileCtl('notex:0.8', 'notey:0.5'));
    check('camera notex 0.8 -> positive xPx', pv.mergedCtrl.xPx > 0,
      `xPx=${pv.mergedCtrl.xPx}`);
    check('camera notex sign differs (neg vs 0.8)', Math.sign(infoNeg.camXpx) === -Math.sign(infoPos8.camXpx),
      `neg=${infoNeg.camXpx} pos8=${infoPos8.camXpx}`);

    // A field-center note must move OPPOSITE to the camera offset.
    const note = pv.chart.noteById(5);
    const pNeg = pv.worldToPx(note.worldX, note.worldY, infoNeg);
    const pPos = pv.worldToPx(note.worldX, note.worldY, infoPos);
    check('note shifts opposite for negative camera x', pNeg.x > pPos.x,
      `negX=${pNeg.x.toFixed(1)} posX=${pPos.x.toFixed(1)}`);

    // --- Compiled-format round trip must keep negative noteX/Y. ---
    const compiledFmt = {
      compiled: true,
      controllers: [{
        Id: 'camC',
        States: [{
          Time: 0, Easing: 0,
          X: { Value: -0.5, Unit: 3, ScaleToCanvas: false, Span: false },
          Y: { Value: -0.5, Unit: 4, ScaleToCanvas: false, Span: false },
        }],
      }],
    };
    const editableCtl = window.SBEngine.storyboard.fromCompiled(compiledFmt);
    const cc = new window.SBEngine.storyboard.StoryboardCompiler(editableCtl, pv.chart).compile();
    pv.compiled = cc;
    pv.mergedCtrl = {};
    pv.evaluate(0.5);
    check('compiled camera notex -0.5 -> negative xPx', pv.mergedCtrl.xPx < 0,
      `xPx=${pv.mergedCtrl.xPx}`);
    check('compiled camera notey -0.5 -> negative yPx', pv.mergedCtrl.yPx < 0,
      `yPx=${pv.mergedCtrl.yPx}`);

    // --- Camera z negative (default -10) still works. ---
    const infoZ = evalCtl(compileCtl(undefined, undefined));
    pv.mergedCtrl.zPx = -20;
    const infoZ2 = pv.ctxInfo();
    check('camera z negative keeps working', infoZ2.perspective === undefined || infoZ2.S > 0,
      `S=${infoZ2.S}`);

    // --- note_controller x/y in noteX/noteY units, negative. ---
    const ncCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
      note_controllers: [{ id: 'nc1', note: 5, states: [{ time: 0, override_x: true, x: 'notex:-0.4', override_y: true, y: 'notey:-0.4' }] }],
    }, pv.chart).compile();
    pv.compiled = ncCompiled;
    pv.mergedCtrl = {};
    pv.evaluate(0.5);
    const ovr = pv.noteOverrides && pv.noteOverrides[5];
    check('note_controller notex -0.4 override active', !!(ovr && ovr.x !== undefined && ovr.x < 0),
      `ovr=${JSON.stringify(ovr)}`);

    // --- Stage object x/y in stageX/stageY units, negative. ---
    const stageCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
      sprites: [{ id: 's1', path: 'x.png', states: [{ time: 0, opacity: 1, x: 'stagex:-100', y: 'stagey:-50', width: 100, height: 100 }] }],
    }, pv.chart).compile();
    pv.compiled = stageCompiled;
    pv.mergedCtrl = {};
    pv.evaluate(0.5);
    const spr = pv.evalResult.sprites.find((s) => s.obj.id === 's1');
    const info3 = pv.ctxInfo();
    const M = pv.stageMatrix(spr.obj, spr, info3);
    check('stage object stagex -100 shifts left', M.e < W / 2,
      `M.e=${M.e.toFixed(1)}`);
    // stageY is up-positive: -50 must move the object DOWN the canvas.
    check('stage object stagey -50 shifts down', M.f > H / 2,
      `M.f=${M.f.toFixed(1)}`);

    // --- Broader negative audit. ---
    const parse = window.SBEngine.storyboard.parseUnitValue;
    check('parse notex:-0.5', parse('notex:-0.5', 'camerax').value === -0.5,
      JSON.stringify(parse('notex:-0.5', 'camerax')));
    check('parse notey:-0.25', parse('notey:-0.25', 'cameray').value === -0.25,
      JSON.stringify(parse('notey:-0.25', 'cameray')));
    check('parse camerax:-2', parse('camerax:-2', 'camerax').value === -2,
      JSON.stringify(parse('camerax:-2', 'camerax')));
    check('parse plain -3', parse(-3, 'world').value === -3,
      JSON.stringify(parse(-3, 'world')));

    // scanline_pos notey negative must place the scanner below the field.
    const scanCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
      controllers: [{ id: 'cam2', states: [{ time: 0, override_scanline_pos: true, scanline_pos: 'notey:-0.5' }] }],
    }, pv.chart).compile();
    pv.compiled = scanCompiled;
    pv.mergedCtrl = {};
    pv.evaluate(0.5);
    check('scanline_pos notey -0.5 -> negative scanline_posPx', pv.mergedCtrl.scanline_posPx < 0,
      `scanline_posPx=${pv.mergedCtrl.scanline_posPx}`);

    // Line point positions in noteX/noteY units, negative.
    const lineCompiled = new window.SBEngine.storyboard.StoryboardCompiler({
      lines: [{ id: 'l1', states: [{ time: 0, opacity: 1, pos: [{ x: 'notex:-0.4', y: 'notey:-0.4', z: 0 }, { x: 'notex:0.6', y: 'notey:0.6', z: 0 }] }] }],
    }, pv.chart).compile();
    pv.compiled = lineCompiled;
    pv.mergedCtrl = {};
    pv.evaluate(0.5);
    const lineR = pv.evalResult.lines.find((s) => s.obj.id === 'l1');
    const pNeg2 = pv.unitPx({ value: -0.4, unit: 'notex' }, pv.ctxInfo());
    const pPos2 = pv.unitPx({ value: 0.6, unit: 'notex' }, pv.ctxInfo());
    check('line notex negative maps left of center', pNeg2 < 0 && pPos2 > 0,
      `neg=${pNeg2.toFixed(1)} pos=${pPos2.toFixed(1)}`);

    // Width/height negative must not be dropped by the parser.
    check('parse negative width', parse('stagex:-50', 'stagex').value === -50);
    check('parse negative scale_x', Number(-2) === -2);

    // note_controller z (world) must be kept as a NUMBER and take effect in
    // the perspective projection (negative moves the note along the camera
    // axis, changing its projected depth/size).
    const ncZ = new window.SBEngine.storyboard.StoryboardCompiler({
      note_controllers: [{ id: 'ncz', note: 5, states: [{ time: 0, override_z: true, z: -2 }] }],
    }, pv.chart).compile();
    pv.compiled = ncZ;
    pv.mergedCtrl = {};
    pv.evaluate(0.5);
    const ovrZ = pv.noteOverrides && pv.noteOverrides[5];
    check('note_controller z normalized to number -2', !!(ovrZ && ovrZ.z === -2),
      `ovr=${JSON.stringify(ovrZ)}`);
    // With a perspective camera, z=-2 (closer to the camera at z=-10) must
    // make the note project LARGER (bigger depth) than z=0.
    pv.mergedCtrl = { perspective: true, fov: 53.2, size: 5, zPx: -10 };
    const infoZ3 = pv.ctxInfo();
    const note5 = pv.chart.noteById(5);
    pv.noteOverrides = { 5: { z: 0 } };
    const pz0 = pv.noteScreenPos(note5, infoZ3);
    pv.noteOverrides = { 5: { z: -2 } };
    const pzNeg = pv.noteScreenPos(note5, infoZ3);
    check('note z -2 changes projected position', Math.abs(pzNeg.depth - pz0.depth) > 0.001,
      `depth0=${pz0.depth.toFixed(4)} depthNeg=${pzNeg.depth.toFixed(4)}`);

    // --- Camera Y must COMPOSE with rotX (native behavior), not be a flat
    // screen shift. With camera Y = notey:-0.3 and rotX=-30, a point near the
    // field bottom lands in the LOWER part of the screen (like the real
    // player); the old screen-shift pushed it off-screen top. ---
    const camYPx = pv.chart.convertChartYToScreenY(-0.3) * pv.ctxInfo().S;
    pv.mergedCtrl = {
      rot_x: -30,
      xPx: 0,
      yPx: camYPx,
    };
    const infoY = pv.ctxInfo();
    const sp = pv.worldToPx(0, -3.6, infoY);
    check('camera Y + rotX composes (scanner in lower half)', sp.y > H / 2 && sp.y < H,
      `y=${sp.y.toFixed(1)} H=${H}`);
    // Same offset WITHOUT rotation must still shift the field UP (camera
    // below the field) - unchanged relative behavior.
    pv.mergedCtrl = { rot_x: 0, xPx: 0, yPx: camYPx };
    const infoY0 = pv.ctxInfo();
    const sp0 = pv.worldToPx(0, -3.6, infoY0);
    check('camera Y alone shifts field up', sp0.y < H / 2, `y=${sp0.y.toFixed(1)}`);

    fs.writeFileSync(path.join(__dirname, 'test_negative_units_out.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'test_negative_units_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
