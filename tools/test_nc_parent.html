<!doctype html>
<html>
<head><meta charset="utf-8"><title>nc parent test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  try {
    const out = { checks: [], ok: true };
    const W = 960, H = 540;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const pv = new window.SBPreview.PreviewRenderer(c);
    pv.mergedCtrl = {};

    const chartText = JSON.stringify({
      format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
      page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
      note_list: [{
        page_index: 0, type: 1, id: 5, tick: 480, x: 0.5,
        has_sibling: false, hold_tick: 120, next_id: 0, is_forward: false, approach_rate: 1
      }],
    });
    const chart = new window.SBEngine.chart.Chart(chartText, { screenRatio: 16 / 9 });
    pv.chart = chart;
    out.chartDebug = {
      notes: chart.notes ? chart.notes.length : -1,
      keys: chart.noteMap ? Object.keys(chart.noteMap) : [],
      hasApi: !!window.SBEngine.chart,
    };

    const raw = {
      note_controllers: [{
        id: 'nc1',
        note: 5,
        states: [{ time: 0, override_x: true, x: 0.5, override_y: true, y: 0.5 }],
      }],
      sprites: [{
        id: 'child',
        parent_id: 'nc1',
        states: [{ time: 0, opacity: 1, x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' } }],
      }],
    };
    pv.compiled = new window.SBEngine.storyboard.StoryboardCompiler(raw, chart).compile();
    pv.evaluate(0.5);

    const check = (name, cond, detail) => {
      out.checks.push({ name, pass: !!cond, detail });
      if (!cond) out.ok = false;
    };
    const info = pv.ctxInfo();
    const spr = (pv.evalResult.sprites || []).find((s) => s.obj.id === 'child');
    check('child sprite evaluated', !!spr, spr ? `states=${spr.obj.states.length}` : 'missing');

    // Compiled note controller must exist with the same id and a numeric note.
    const nc = pv.compiled.noteControllers.find((n) => n.id === 'nc1');
    check('compiled note controller found', !!nc, nc ? `note=${nc.note}` : 'missing');
    if (nc) check('nc note is number', typeof nc.note === 'number', `type=${typeof nc.note}`);

    // The note itself must resolve.
    const note = chart.noteById(5);
    check('chart note 5 exists', !!note, note ? `type=${note.type}` : 'missing');

    if (spr && nc && note) {
      const M = pv.stageMatrix(spr.obj, spr, info);
      const noteP = pv.noteScreenPos(note, info);
      // If the parent resolves, the child matrix anchors at the note position.
      const dx = Math.abs(M.e - noteP.x);
      const dy = Math.abs(M.f - noteP.y);
      check('child matrix anchored at note', dx < 1 && dy < 1,
        `M=(${M.e.toFixed(1)},${M.f.toFixed(1)}) note=(${noteP.x.toFixed(1)},${noteP.y.toFixed(1)})`);
      // noteOverrides must exist for note 5 (controller takes effect).
      const ovr = pv.noteOverrides && pv.noteOverrides[5];
      check('note 5 has override', !!ovr, ovr ? JSON.stringify(ovr) : 'missing');
    }

    // --- Multi-note selector: note_controllers with note:[5,6] expand into
    // two entries sharing id 'nc2'. A child parented to 'nc2' must follow the
    // note that is currently active, falling back to the first. ---
    const chartText2 = JSON.stringify({
      format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
      page_list: [
        { start_tick: 0, end_tick: 1920, scan_line_direction: -1 },
        { start_tick: 1920, end_tick: 3840, scan_line_direction: 1 },
      ],
      note_list: [
        { page_index: 0, type: 0, id: 5, tick: 240, x: 0.5, has_sibling: false, hold_tick: 0, next_id: 0, is_forward: false, approach_rate: 1 },
        { page_index: 0, type: 0, id: 6, tick: 960, x: 0.5, has_sibling: false, hold_tick: 0, next_id: 0, is_forward: false, approach_rate: 1 },
        { page_index: 1, type: 0, id: 7, tick: 2880, x: 0.5, has_sibling: false, hold_tick: 0, next_id: 0, is_forward: false, approach_rate: 1 },
      ],
    });
    const chart2 = new window.SBEngine.chart.Chart(chartText2, { screenRatio: 16 / 9 });
    const raw2 = {
      note_controllers: [{
        id: 'nc2',
        note: [5, 6],
        states: [{ time: 0, opacity_multiplier: 1 }],
      }, {
        id: 'nc3',
        note: 7,
        states: [{ time: 0, opacity_multiplier: 1 }],
      }],
      sprites: [{
        id: 'child2',
        parent_id: 'nc2',
        states: [{ time: 0, opacity: 1 }],
      }, {
        id: 'child3',
        parent_id: 'nc3',
        states: [{ time: 0, opacity: 1 }],
      }],
    };
    const pv2 = new window.SBPreview.PreviewRenderer(document.createElement('canvas'));
    pv2.mergedCtrl = {};
    pv2.chart = chart2;
    pv2.compiled = new window.SBEngine.storyboard.StoryboardCompiler(raw2, chart2).compile();
    const nc2Count = pv2.compiled.noteControllers.filter((n) => n.id === 'nc2').length;
    check('nc2 expanded to 2 entries', nc2Count === 2, `count=${nc2Count}`);
    const n5b = chart2.noteById(5);
    const n6b = chart2.noteById(6);
    const tActive6 = n6b.start_time + 0.01;
    pv2.time = tActive6;
    pv2.evaluate(tActive6);
    const spr2 = pv2.evalResult.sprites.find((s) => s.obj.id === 'child2');
    const info2 = pv2.ctxInfo();
    const M2 = pv2.stageMatrix(spr2.obj, spr2, info2);
    const p6 = pv2.noteScreenPos(n6b, info2);
    check('multi-note child follows active note 6',
      Math.abs(M2.e - p6.x) < 1 && Math.abs(M2.f - p6.y) < 1,
      `M=(${M2.e.toFixed(1)},${M2.f.toFixed(1)}) n6=(${p6.x.toFixed(1)},${p6.y.toFixed(1)})`);
    // With no note currently on screen, the selector falls back to the first
    // expanded entry whose note is spawned (note 5 has a negative intro, so it
    // is already approaching at t=0.001).
    const tEarly = 0.001;
    pv2.time = tEarly;
    pv2.evaluate(tEarly);
    const M2e = pv2.stageMatrix(pv2.evalResult.sprites.find((s) => s.obj.id === 'child2').obj,
      pv2.evalResult.sprites.find((s) => s.obj.id === 'child2'), info2);
    const p5 = pv2.noteScreenPos(n5b, info2);
    check('multi-note child falls back to first spawned note',
      Math.abs(M2e.e - p5.x) < 1 && Math.abs(M2e.f - p5.y) < 1,
      `M=(${M2e.e.toFixed(1)},${M2e.f.toFixed(1)}) n5=(${p5.x.toFixed(1)},${p5.y.toFixed(1)})`);

    // A note far in the future is not spawned yet: Unity anchors its
    // controller's placeholder at the WORLD ORIGIN (projects to the canvas
    // center), not at the note's chart position.
    const tBefore7 = 0.5;
    pv2.time = tBefore7;
    pv2.evaluate(tBefore7);
    const spr3 = pv2.evalResult.sprites.find((s) => s.obj.id === 'child3');
    const M3 = pv2.stageMatrix(spr3.obj, spr3, info2);
    const origin = pv2.worldToPx(0, 0, info2);
    check('unspawned note controller anchors at world origin',
      Math.abs(M3.e - origin.x) < 1 && Math.abs(M3.f - origin.y) < 1,
      `M=(${M3.e.toFixed(1)},${M3.f.toFixed(1)}) origin=(${origin.x.toFixed(1)},${origin.y.toFixed(1)})`);

    fs.writeFileSync(path.join(__dirname, 'test_nc_parent_out.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'test_nc_parent_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
