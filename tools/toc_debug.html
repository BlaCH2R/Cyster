<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>body{margin:0}#manualBody{height:600px;overflow:auto}</style>
</head>
<body>
  <div id="manualBody"><div id="docxContainer"></div></div>
  <script src="../app/src/renderer/vendor/jszip.min.js"></script>
  <script src="../app/src/renderer/vendor/docx-preview.min.js"></script>
  <script src="../app/src/renderer/manual_textbox_flat.js"></script>
  <script>
    window.__render = async () => {
      const out = { ok: false, error: null, rows: [] };
      try {
        const bin = atob(window.__docxData);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        const flattened = await window.flattenManualTextboxes(blob);
        await window.docx.renderAsync(flattened, document.getElementById('docxContainer'), null, {});
        const ps = Array.from(document.querySelectorAll('#docxContainer .docx-wrapper p'));
        const start = ps.findIndex((p) => (p.textContent || '').trim().startsWith('章节目录'));
        for (let i = Math.max(0, start); i < Math.min(ps.length, start + 30); i++) {
          const t = (ps[i].textContent || '').trim();
          out.rows.push(i + ': ' + JSON.stringify(t.slice(0, 50)) + (t ? '' : ' <blank>'));
        }
        out.numbered = [];
        ps.forEach((p, i) => {
          const t = (p.textContent || '').trim();
          if (/^0\d[：:]/.test(t)) out.numbered.push(i + ': ' + JSON.stringify(t.slice(0, 60)));
        });
        out.chapters = [];
        ps.forEach((p, i) => {
          const t = (p.textContent || '').trim();
          if (t.includes('中央预览画面介绍') || t.includes('底部时间轴界面介绍')) {
            out.chapters.push({
              idx: i,
              text: t.slice(0, 40),
              cls: p.className,
              htmlHead: p.innerHTML.replace(/\s+/g, ' ').slice(0, 160)
            });
          }
        });
        out.ok = true;
      } catch (e) { out.error = String(e && (e.stack || e.message) || e); }
      return out;
    };
  </script>
</body>
</html>
