<!doctype html>
<html>
<head><meta charset="utf-8"><title>sprite 3d rotation probe</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  (async () => {
    try {
      const out = { checks: [], ok: true };
      const check = (name, cond, detail) => {
        out.checks.push({ name, pass: !!cond, detail: String(detail) });
        if (!cond) out.ok = false;
      };
      const W = 960, H = 540;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const mk = () => {
        const pv = new window.SBPreview.PreviewRenderer(canvas);
        pv.chart = new window.SBEngine.chart.Chart(JSON.stringify({
          format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
          page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
          note_list: []
        }), { screenRatio: 16 / 9 });
        return pv;
      };

      const cornersOf = (pv, id, info) => {
        const r = (pv.evalResult.sprites || []).find((s) => s.obj.id === id);
        const m3 = pv.stageMatrix3(r.obj, r, info);
        const w = pv.stageUnitPx({ value: 200, unit: 'stagex' }, info, true);
        const h = pv.stageUnitPx({ value: 200, unit: 'stagey' }, info, true);
        const uL = -w / 2, uR = w / 2, vT = -h / 2, vB = h / 2;
        const tl = pv.stageProjectPoint(m3, uL, vT, info);
        const tr = pv.stageProjectPoint(m3, uR, vT, info);
        const br = pv.stageProjectPoint(m3, uR, vB, info);
        const bl = pv.stageProjectPoint(m3, uL, vB, info);
        return { tl, tr, br, bl, m3, w, h };
      };

      const evalSprite = (pv, fields) => {
        pv.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
          sprites: [{
            id: 's',
            x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' },
            width: { value: 200, unit: 'stagex' }, height: { value: 200, unit: 'stagey' },
            states: [{ time: 0, opacity: 1, ...fields }],
          }],
        }, pv.chart).compile();
        pv.evaluate(0.5);
      };

      const spans = (c) => {
        const top = Math.hypot(c.tr.x - c.tl.x, c.tr.y - c.tl.y);
        const bottom = Math.hypot(c.br.x - c.bl.x, c.br.y - c.bl.y);
        const left = Math.hypot(c.bl.x - c.tl.x, c.bl.y - c.tl.y);
        const right = Math.hypot(c.br.x - c.tr.x, c.br.y - c.tr.y);
        return { top, bottom, left, right };
      };

      // ---------------- Perspective mode ----------------
      const pv = mk();
      pv.mergedCtrl = { perspective: true, fov: 53.2, size: 5, zPx: -10, xPx: 0, yPx: 0, rot_x: 0, rot_y: 0, rot_z: 0 };
      const infoP = pv.ctxInfo();

      // Continuity across 0° for rot_x / rot_y / rot_z.
      for (const axis of ['rot_x', 'rot_y', 'rot_z']) {
        const posAt = (deg) => {
          evalSprite(pv, { [axis]: deg });
          const c = cornersOf(pv, 's', infoP);
          return [c.tl.x, c.tl.y, c.tr.x, c.tr.y, c.br.x, c.br.y, c.bl.x, c.bl.y];
        };
        const p0 = posAt(0), pP = posAt(0.1), pN = posAt(-0.1);
        let dP = 0, dN = 0;
        for (let i = 0; i < 8; i++) { dP = Math.max(dP, Math.abs(pP[i] - p0[i])); dN = Math.max(dN, Math.abs(pN[i] - p0[i])); }
        out[axis + '_cont'] = { dP: +dP.toFixed(4), dN: +dN.toFixed(4) };
        check(axis + ' continuous across 0 (small-angle move is small)',
          dP < 1.5 && dN < 1.5, JSON.stringify({ dP, dN }));
      }

      // rot_x direction (engine-verified): +rot_x -> BOTTOM edge wider
      // (nearer), -rot_x -> top wider.
      {
        evalSprite(pv, { rot_x: 30 });
        const c30 = spans(cornersOf(pv, 's', infoP));
        evalSprite(pv, { rot_x: -30 });
        const cN30 = spans(cornersOf(pv, 's', infoP));
        out.rotx = { c30, cN30 };
        check('+rot_x widens the BOTTOM edge (perspective)',
          c30.bottom > c30.top, `top=${c30.top.toFixed(2)} bottom=${c30.bottom.toFixed(2)}`);
        check('-rot_x widens the TOP edge (perspective)',
          cN30.top > cN30.bottom, `top=${cN30.top.toFixed(2)} bottom=${cN30.bottom.toFixed(2)}`);
      }

      // rot_y direction (engine-verified): +rot_y -> RIGHT edge nearer
      // (longer), -rot_y -> LEFT edge nearer.
      {
        evalSprite(pv, { rot_y: 30 });
        const c30 = spans(cornersOf(pv, 's', infoP));
        evalSprite(pv, { rot_y: -30 });
        const cN30 = spans(cornersOf(pv, 's', infoP));
        out.roty = { c30, cN30 };
        check('+rot_y widens the RIGHT edge (perspective)',
          c30.right > c30.left, `right=${c30.right.toFixed(2)} left=${c30.left.toFixed(2)}`);
        check('-rot_y widens the LEFT edge (perspective)',
          cN30.left > cN30.right, `right=${cN30.right.toFixed(2)} left=${cN30.left.toFixed(2)}`);
      }

      // rot_z direction: +rot_z rotates counterclockwise on screen.
      {
        const centerX = infoP.W / 2, centerY = infoP.H / 2;
        const angle = (deg) => {
          evalSprite(pv, { rot_z: deg });
          const c = cornersOf(pv, 's', infoP);
          return Math.atan2(c.tr.y - centerY, c.tr.x - centerX) * 180 / Math.PI;
        };
        const a0 = angle(0), a30 = angle(30);
        let diff = a30 - a0;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        out.rotz = { a0: +a0.toFixed(2), a30: +a30.toFixed(2), diff: +diff.toFixed(2) };
        // Canvas y is down: a positive atan2 decrease = clockwise in canvas
        // coords = counterclockwise on the y-up screen, matching Unity.
        check('+rot_z rotates counterclockwise on screen (CCW)',
          diff < -20 && diff > -40, JSON.stringify(out.rotz));
      }

      // Parent inheritance: child of a rotated stage parent tilts the SAME
      // way as the parent (Unity transform hierarchy, no depth inversion).
      {
        pv.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
          sprites: [
            {
              id: 'p',
              x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' },
              width: { value: 200, unit: 'stagex' }, height: { value: 200, unit: 'stagey' },
              states: [{ time: 0, opacity: 1, rot_x: 30 }],
            },
            {
              id: 'c', parent_id: 'p',
              x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' },
              width: { value: 200, unit: 'stagex' }, height: { value: 200, unit: 'stagey' },
              states: [{ time: 0, opacity: 1 }],
            },
          ],
        }, pv.chart).compile();
        pv.evaluate(0.5);
        const cp = spans(cornersOf(pv, 'p', infoP));
        const cc = spans(cornersOf(pv, 'c', infoP));
        out.parented = { parent: cp, child: cc };
        check('child inherits parent tilt in the SAME direction (bottom wider)',
          cc.top < cc.bottom && cp.top < cp.bottom,
          JSON.stringify({ cp: { t: +cp.top.toFixed(2), b: +cp.bottom.toFixed(2) }, cc: { t: +cc.top.toFixed(2), b: +cc.bottom.toFixed(2) } }));
      }

      // ---------------- Ortho mode ----------------
      const pvO = mk();
      pvO.mergedCtrl = { perspective: false, size: 5, zPx: -10, xPx: 0, yPx: 0, rot_x: 0, rot_y: 0, rot_z: 0 };
      const infoO = pvO.ctxInfo();
      const evalO = (fields) => {
        pvO.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
          sprites: [{
            id: 's',
            x: { value: 0, unit: 'stagex' }, y: { value: 0, unit: 'stagey' },
            width: { value: 200, unit: 'stagex' }, height: { value: 200, unit: 'stagey' },
            states: [{ time: 0, opacity: 1, ...fields }],
          }],
        }, pvO.chart).compile();
        pvO.evaluate(0.5);
      };
      evalO({ rot_x: 30 });
      const o30 = cornersOf(pvO, 's', infoO);
      evalO({ rot_x: 0 });
      const o0 = cornersOf(pvO, 's', infoO);
      const projH0 = Math.abs(o0.tl.y - o0.bl.y);
      const projH30 = Math.abs(o30.tl.y - o30.bl.y);
      out.ortho = {
        projH0: +projH0.toFixed(2), projH30: +projH30.toFixed(2),
        top0: +spans(o0).top.toFixed(2), top30: +spans(o30).top.toFixed(2),
        bottom30: +spans(o30).bottom.toFixed(2),
      };
      check('ortho +rot_x: no trapezoid (top == bottom)',
        Math.abs(spans(o30).top - spans(o30).bottom) < 1,
        JSON.stringify(out.ortho));
      check('ortho +rot_x: height shrinks by cos(30°)',
        Math.abs(projH30 / projH0 - Math.cos(30 * Math.PI / 180)) < 0.02,
        JSON.stringify({ projH30: +projH30.toFixed(2), projH0: +projH0.toFixed(2), ratio: +(projH30 / projH0).toFixed(3) }));

      fs.writeFileSync(path.join(__dirname, 'probe_sprite_rot3d_out.json'), JSON.stringify(out, null, 2));
      window.close();
    } catch (e) {
      fs.writeFileSync(path.join(__dirname, 'probe_sprite_rot3d_err.txt'), String(e && e.stack || e));
      window.close();
    }
  })();
</script>
</body>
</html>
