<!doctype html>
<html>
<head><meta charset="utf-8"><title>sprite GL alpha comparison</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  try {
    const W = 800, H = 600;
    const out = { checks: [], ok: true };
    const check = (name, cond, detail) => {
      out.checks.push({ name, pass: !!cond, detail: String(detail) });
      if (!cond) out.ok = false;
    };

    // Texture with distinct alpha bands: opaque, 75%, 50%, 25%, 0% (checker).
    const sprite = document.createElement('canvas');
    sprite.width = 500; sprite.height = 500;
    const sctx = sprite.getContext('2d');
    const bands = [1, 0.75, 0.5, 0.25, 0];
    const colors = ['#ff00ff', '#00ff88', '#ff8800', '#4488ff', '#ff0000'];
    for (let b = 0; b < bands.length; b++) {
      sctx.globalAlpha = bands[b];
      sctx.fillStyle = colors[b];
      sctx.fillRect(0, b * 100, 500, 100);
    }
    sctx.globalAlpha = 1;
    sctx.fillStyle = '#ffffff';
    sctx.fillRect(0, 0, 500, 4);
    sctx.fillRect(0, 496, 500, 4);
    sctx.fillRect(0, 0, 4, 500);
    sctx.fillRect(496, 0, 4, 500);

    function render(opacity, color, forceCPU) {
      const origGet = HTMLCanvasElement.prototype.getContext;
      if (forceCPU) {
        HTMLCanvasElement.prototype.getContext = function (type) {
          if (String(type).indexOf('webgl') >= 0) return null;
          return origGet.apply(this, arguments);
        };
      }
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#404040';
      ctx.fillRect(0, 0, W, H);
      const pv = new window.SBPreview.PreviewRenderer(c);
      pv._warpMax = 4096;
      pv.mergedCtrl = { perspective: true, fov: 53.2, size: 5, xPx: 0, yPx: 0, zPx: -10 };
      const info = pv.ctxInfo();
      const obj = { id: 'a', kind: 'sprite', parentId: null };
      const r = { from: { path: 'a.png', rot_x: 0, rot_y: 0, x: 0, y: 0, scale: 1, scale_x: 1, scale_y: 1 }, to: {}, t: 0 };
      pv.drawSpriteWarped(ctx, spriteImg, obj, r, info, 500, 500, 0.5, 0.5, color, opacity);
      HTMLCanvasElement.prototype.getContext = origGet;
      return { pv, ctx, c };
    }

    const spriteImg = new Image();
    spriteImg.onload = () => {
      const cases = [];
      for (const opacity of [1, 0.7, 0.4, 0.15]) {
        cases.push({ name: 'opacity ' + opacity + ' no tint', opacity, color: { r: 1, g: 1, b: 1, a: 1 } });
        cases.push({ name: 'opacity ' + opacity + ' red tint', opacity, color: { r: 1, g: 0.2, b: 0.2, a: 1 } });
      }
      for (const cs of cases) {
        const gl = render(cs.opacity, cs.color, false);
        const cpu = render(cs.opacity, cs.color, true);
        const gd = gl.ctx.getImageData(0, 0, W, H).data;
        const cd = cpu.ctx.getImageData(0, 0, W, H).data;
        let diffPx = 0, maxR = 0, maxG = 0, maxB = 0, maxA = 0;
        let alphaBad = 0;
        for (let i = 0; i < gd.length; i += 4) {
          const dr = Math.abs(gd[i] - cd[i]);
          const dg = Math.abs(gd[i + 1] - cd[i + 1]);
          const db = Math.abs(gd[i + 2] - cd[i + 2]);
          const da = Math.abs(gd[i + 3] - cd[i + 3]);
          if (dr > maxR) maxR = dr;
          if (dg > maxG) maxG = dg;
          if (db > maxB) maxB = db;
          if (da > maxA) maxA = da;
          if (Math.max(dr, dg, db, da) > 12) diffPx++;
          if (da > 4) alphaBad++;
        }
        const total = W * H;
        check(cs.name + ': GL vs CPU close',
          diffPx < total * 0.01 && maxA <= 12,
          `diffPx=${diffPx} (${(100 * diffPx / total).toFixed(3)}%) maxR=${maxR} maxG=${maxG} maxB=${maxB} maxA=${maxA} alphaBad=${alphaBad}`);
      }
      fs.writeFileSync(path.join(__dirname, 'probe_sprite_alpha_out.json'), JSON.stringify(out, null, 2));
      window.close();
    };
    spriteImg.onerror = () => {
      fs.writeFileSync(path.join(__dirname, 'probe_sprite_alpha_err.txt'), 'sprite load error');
      window.close();
    };
    spriteImg.src = sprite.toDataURL('image/png');
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'probe_sprite_alpha_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
