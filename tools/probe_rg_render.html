<!doctype html>
<html>
<head><meta charset="utf-8"><title>robotic girl sprite position probe</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/effects.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  (async () => {
    const out = { ok: true, notes: [] };
    const LEVEL_DIR = 'V:/cytoid storyboarder/项目/测试：robotic girl/ロボティックガール';
    const W = 1280, H = 720;
    try {
      const chartText = fs.readFileSync(path.join(LEVEL_DIR, 'chart.base.txt'), 'utf8');
      const sbRaw = JSON.parse(fs.readFileSync(path.join(LEVEL_DIR, 'storyboard_compiled.json'), 'utf8'));
      const sbJson = window.SBEngine.storyboard.fromCompiled(sbRaw);

      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const pv = new window.SBPreview.PreviewRenderer(c);
      pv.chart = new window.SBEngine.chart.Chart(chartText, { screenRatio: W / H });
      pv.compiled = new window.SBEngine.storyboard.StoryboardCompiler(sbJson, pv.chart).compile();

      // Load every referenced image into the cache (data URLs).
      const imgToData = (p) => new Promise((resolve) => {
        const b = fs.readFileSync(p);
        const ext = path.extname(p).toLowerCase() === '.jpg' ? 'jpeg' : 'png';
        const url = `data:image/${ext};base64,${b.toString('base64')}`;
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => resolve(null);
        im.src = url;
      });
      const seen = new Set();
      const loadPath = async (p) => {
        if (seen.has(p)) return;
        seen.add(p);
        const full = path.join(LEVEL_DIR, p);
        if (!fs.existsSync(full)) return;
        const im = await imgToData(full);
        if (im) pv.imageCache[p] = im;
      };
      for (const r of pv.compiled.sprites || []) {
        for (const s of r.states || []) if (s.path) await loadPath(s.path);
      }
      for (const r of pv.compiled.videos || []) {
        for (const s of r.states || []) if (s.path) await loadPath(s.path);
      }
      if (fs.existsSync(path.join(LEVEL_DIR, 'bg.jpg'))) {
        const im = await imgToData(path.join(LEVEL_DIR, 'bg.jpg'));
        if (im) { pv.imageCache['bg.jpg'] = im; pv.backgroundImage = im; }
      }
      pv.level = { background: { path: 'bg.jpg' } };

      // Fake the video element with a canvas so the draw path runs (position
      // math identical; content approximated).
      const vCan = document.createElement('canvas');
      vCan.width = 1920; vCan.height = 1080;
      vCan.videoWidth = 1920; vCan.videoHeight = 1080;
      vCan.readyState = 2;
      vCan.currentTime = 0;
      vCan.paused = true;
      vCan.play = () => {}; vCan.pause = () => {};
      const vd = pv.videoCache || (pv.videoCache = {});
      vd['video.mp4'] = vCan;

      pv.time = 60.604;
      pv.mergedCtrl = {};
      pv.evaluate(60.604);
      const info = pv.ctxInfo();
      out.debug = {
        baseSize: pv.chart.baseSize,
        screenRatio: pv.chart.screenRatio,
        horizontalRatio: pv.chart.horizontalRatio,
        verticalRatio: pv.chart.verticalRatio,
        verticalOffset: pv.chart.verticalOffset,
        S0: pv.stageUnitPx({ value: 1, unit: 'notex' }, pv.ctxInfo(), false),
        cx06002: pv.chart.convertChartXToScreenX(0.6002),
        cy025: pv.chart.convertChartYToScreenY(0.25),
        stageX06002: pv.stageUnitPx({ value: 0.6002, unit: 'notex' }, info, false),
        stageY025: pv.stageUnitPx({ value: 0.25, unit: 'notey' }, info, false),
      };
      const kr = pv.evalResult.sprites.find((r) => r.obj.id === 'k0opp0q6.gk1');
      if (kr) {
        const M = pv.stageMatrix(kr.obj, kr, info);
        out.debug.k0Matrix = { a: M.a, b: M.b, c: M.c, d: M.d, e: M.e, f: M.f };
        out.debug.k0From = { x: kr.from.x, y: kr.from.y, w: kr.from.width, h: kr.from.height,
          rx: kr.from.rot_x, rz: kr.from.rot_z, sx: kr.from.scale_x, sy: kr.from.scale_y };
      }
      out.info = { W, H, S: info.S, ortho: info.ortho, baseOrtho: (pv.chart && pv.chart.baseSize) || info.ortho,
        camXpx: info.camXpx, camYpx: info.camYpx, rotZ: info.rotZ, perspective: info.perspective };

      // Per-object bounding box on a scratch canvas (no notes/UI).
      const bbox = (kind, r) => {
        const ctx = c.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        if (kind === 'line') pv.drawLine(ctx, info, r, 1);
        else pv.drawStageObject(ctx, info, r, kind, 1);
        const img = ctx.getImageData(0, 0, W, H).data;
        let minX = -1, maxX = -1, minY = -1, maxY = -1, lit = 0;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            if (img[i] + img[i + 1] + img[i + 2] > 90) {
              lit++;
              if (minX < 0) minX = x;
              maxX = x;
              if (minY < 0) minY = y;
              maxY = y;
            }
          }
        }
        if (minX < 0) return null;
        return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, minX, maxX, minY, maxY, lit };
      };

      out.sprites = [];
      for (const r of pv.evalResult.sprites || []) {
        const from = r.from;
        if ((from.opacity == null ? 0 : from.opacity) <= 0.004) continue;
        const box = bbox('sprite', r);
        if (!box) continue;
        out.sprites.push({
          id: r.obj.id, path: from.path, x: from.x, y: from.y,
          w: from.width, h: from.height, fill: from.fill_width, layer: from.layer,
          opacity: from.opacity, box,
        });
      }
      out.texts = [];
      for (const r of pv.evalResult.texts || []) {
        const from = r.from;
        if ((from.opacity == null ? 0 : from.opacity) <= 0.004) continue;
        const box = bbox('text', r);
        if (!box) continue;
        out.texts.push({ id: r.obj.id, text: from.text, x: from.x, y: from.y, layer: from.layer, box });
      }

      // Render the full frame (background + layers) and save a PNG.
      pv.effectsEnabled = false;
      pv.render();
      const dataUrl = c.toDataURL('image/png');
      fs.writeFileSync(path.join(__dirname, 'probe_rg_render_shot.png'), Buffer.from(dataUrl.split(',')[1], 'base64'));
      fs.writeFileSync(path.join(__dirname, 'probe_rg_render_out.json'), JSON.stringify(out, null, 2));
      window.close();
    } catch (e) {
      fs.writeFileSync(path.join(__dirname, 'probe_rg_render_err.txt'), String(e && e.stack || e));
      window.close();
    }
  })();
</script>
</body>
</html>
