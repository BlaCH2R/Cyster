<!doctype html>
<html>
<head><meta charset="utf-8"><title>scene compare</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  (async () => {
    try {
      const out = { shots: [], sprites: {}, camera: {} };
      const W = 960, H = 540;
      const dir = 'V:/cytoid storyboarder/项目/测试：robotic girl/ロボティックガール';
      const chartText = fs.readFileSync(path.join(dir, 'chart.base.txt'), 'utf8');
      const sbText = fs.readFileSync(path.join(dir, 'storyboard_compiled.json'), 'utf8');
      const chart = new window.SBEngine.chart.Chart(chartText, { screenRatio: 16 / 9 });
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const pv = new window.SBPreview.PreviewRenderer(c);
      pv.chart = chart;
      pv.levelDir = dir;
      pv.effectsEnabled = false;
      pv.compiled = new window.SBEngine.storyboard.StoryboardCompiler(
        window.SBEngine.storyboard.fromCompiled(JSON.parse(sbText)), chart).compile();

      const loadImg = (rel) => {
        const buf = fs.readFileSync(path.join(dir, rel));
        const img = new Image();
        img.src = 'data:image/png;base64,' + buf.toString('base64');
        return new Promise((res) => { img.onload = () => res(img); img.onerror = () => res(null); });
      };
      // Background + storyboard sprites
      const bg = await loadImg('bg.jpg');
      if (bg) pv.imageCache['bg.jpg'] = bg;
      for (const rel of ['big_dad.png', '7.png', '1.png', '3.png', '4.png', 'line.png', 'shadow.png']) {
        const img = await loadImg(rel);
        if (img) pv.imageCache[rel] = img;
      }
      // Player note textures
      const assetsDir = path.join(__dirname, '..', 'app', 'assets', 'player');
      const loadP = async (name) => {
        const buf = fs.readFileSync(path.join(assetsDir, name));
        const img = new Image();
        img.src = 'data:image/png;base64,' + buf.toString('base64');
        await new Promise((res) => { img.onload = () => res(img); img.onerror = () => res(null); });
        return img;
      };
      const [ring, fill, hring] = await Promise.all([loadP('note_ring.png'), loadP('note_fill.png'), loadP('hold_ring.png')]);
      pv.playerAssets = { noteRing: ring, noteFill: fill, holdRing: hring, flickFill: null, flickRing: null, flickLeft: null, flickRight: null, holdLine: null, holdTriangle: null, cDragFill: null, dragLine: null };

      const renderAt = (t, name) => {
        pv.time = t;
        pv.evaluate(t);
        const info = pv.ctxInfo();
        const w0 = pv.worldToPx(0, 0, info);
        out.camera[t] = {
          mergedCtrl: pv.mergedCtrl ? {
            xPx: pv.mergedCtrl.xPx, yPx: pv.mergedCtrl.yPx, zPx: pv.mergedCtrl.zPx,
            rotX: pv.mergedCtrl.rot_x, rotY: pv.mergedCtrl.rot_y, rotZ: pv.mergedCtrl.rot_z,
            size: pv.mergedCtrl.size, fov: pv.mergedCtrl.fov, perspective: pv.mergedCtrl.perspective,
          } : null,
          worldOrigin: { x: w0.x, y: w0.y },
          S: info.S, syF: info.syF, sxF: info.sxF, rotZ: info.rotZ,
        };
        const M = (id) => {
          const r = (pv.evalResult.sprites || []).find((s) => s.obj.id === id);
          if (!r) return null;
          const m = pv.stageMatrix(r.obj, r, info);
          let local3 = null;
          try { local3 = pv.stageLocal3(r.from, info); } catch (e5) {}
          return { e: +m.e.toFixed(1), f: +m.f.toFixed(1), a: +m.a.toFixed(3), b: +m.b.toFixed(3), c: +m.c.toFixed(3), d: +m.d.toFixed(3), local3: local3 ? { a: +local3[0].toFixed(3), b: +local3[1].toFixed(3) } : null, from: r.from };
        };
        out.sprites[t] = {
          big_dad: M('big_dad'),
          hit0_2: M('hit0.2'),
          hit0_4: M('hit0.4'),
          hit0_6: M('hit0.6'),
          hit0_8: M('hit0.8'),
          up_left_tip: M('up_left_tip'),
          down_right_tip: M('down_right_tip'),
        };
        pv.render();
        const buf = c.toDataURL('image/png').replace(/^data:image\/png;base64,/, '');
        fs.writeFileSync(path.join(__dirname, name), buf, 'base64');
        out.shots.push(name);
      };

      renderAt(199.775, 'probe_scene_199.png');
      renderAt(196.917, 'probe_scene_196.png');

      // Note 1103 diagnostics
      const n1103 = chart.noteById(1103);
      if (n1103) {
        pv.time = 196.917;
        pv.evaluate(196.917);
        const ovr = pv.noteOverrides && pv.noteOverrides[1103];
        const info = pv.ctxInfo();
        const npos = pv.notePos(n1103, info);
        out.note1103 = {
          type: n1103.type, start: n1103.start_time, end: n1103.end_time,
          worldX: n1103.worldX, worldY: n1103.worldY, chartY: n1103.chartY,
          screenX: npos.x, screenY: npos.y,
          override: ovr ? { rot_x: ovr.rot_x, rot_y: ovr.rot_y, rot_z: ovr.rot_z, style: ovr.style, opacity: ovr.opacity, x: ovr.x, y: ovr.y } : null,
        };
      }

      fs.writeFileSync(path.join(__dirname, 'probe_scene_compare_out.json'), JSON.stringify(out, null, 2));
      window.close();
    } catch (e) {
      fs.writeFileSync(path.join(__dirname, 'probe_scene_compare_err.txt'), String(e && e.stack || e));
      window.close();
    }
  })();
</script>
</body>
</html>
