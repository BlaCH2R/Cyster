<!doctype html>
<html>
<head><meta charset="utf-8"><title>fx visual test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/renderer/effects.js"></script>
<script>
  try {
    const dbg = (s) => fs.appendFileSync(path.join(__dirname, 'fx_visual_debug.txt'), s + '\n');
    dbg('step1 start');
    const W = 960, H = 540;
    const img = new Image();
    img.src = 'file:///' + path.join(__dirname, '_player_backup', 'bg.jpg').replace(/\\/g, '/');
    dbg('step2 src=' + img.src);
    img.onload = () => {
      dbg('step3 onload');
      const base = document.createElement('canvas');
      base.width = W; base.height = H;
      const bctx = base.getContext('2d');
      bctx.drawImage(img, 0, 0, W, H);
      const save = (name, ctx) => {
        fs.writeFileSync(path.join(__dirname, name), ctx.canvas.toDataURL('image/png').split(',')[1], 'base64');
      };
      save('fx_visual_base.png', bctx);

      const run = (name, eff, time) => {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        ctx.drawImage(base, 0, 0);
        window.SBEffects.applyEffects(ctx, c, W, H, eff, time);
        save('fx_visual_' + name + '.png', ctx);
        fs.appendFileSync(path.join(__dirname, 'probe_fx_visual_log.txt'),
          name + ' glUsed=' + window.SBGlUsed + '\n');
      };
      run('arcade', { arcade: true, arcade_intensity: 1, arcade_interference_size: 1, arcade_interference_speed: 0.5, arcade_contrast: 1 }, 3.0);
      run('arcade_size5', { arcade: true, arcade_intensity: 1, arcade_interference_size: 5, arcade_interference_speed: 3, arcade_contrast: 1 }, 3.0);
      run('focus', { focus: true, focus_intensity: 0.25, focus_size: 1, focus_speed: 5, focus_color: { r: 1, g: 1, b: 1, a: 1 } }, 1.5);
      run('shockwave', { shockwave: true, shockwave_speed: 1 }, 0.0);
      window.close();
    };
    img.onerror = (e) => {
      dbg('step3 onerror');
      fs.writeFileSync(path.join(__dirname, 'probe_fx_visual_err.txt'), 'img load error');
      window.close();
    };
  } catch (e) {
    try { fs.appendFileSync(path.join(__dirname, 'fx_visual_debug.txt'), 'EXC ' + (e && e.stack || e) + '\n'); } catch (e2) {}
    fs.writeFileSync(path.join(__dirname, 'probe_fx_visual_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
