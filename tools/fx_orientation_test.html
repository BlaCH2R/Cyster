<!doctype html>
<html>
<head><meta charset="utf-8"><title>orientation test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/renderer/effects.js"></script>
<script>
  try {
    const c = document.createElement('canvas');
    c.width = 64;
    c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, 64, 32);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 32, 64, 32);
    const px = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);
    const before = { top: px(32, 8), bottom: px(32, 56) };
    const eff = { color_filter: true, color_filter_color: { r: 1, g: 1, b: 1, a: 1 } };
    window.SBEffects.applyEffects(ctx, c, 64, 64, eff, 0);
    const after = { top: px(32, 8), bottom: px(32, 56) };
    const flipped = after.top[0] < 128 && after.bottom[0] > 128;
    fs.writeFileSync(path.join(__dirname, 'probe_orientation_out.json'),
      JSON.stringify({ before, after, glUsed: window.SBGlUsed, flipped }, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'probe_orientation_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
