<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <div id="container"></div>
  <script src="../app/src/renderer/vendor/jszip.min.js"></script>
  <script src="../app/src/renderer/vendor/docx-preview.min.js"></script>
  <script src="../app/src/renderer/manual_textbox_flat.js"></script>
  <script>
    window.__render = async () => {
      const out = { ok: false, error: null, sections: 0, paras: 0, tables: 0, images: 0, hasDocx: false, baseWidth: 0, zoom: 0, hasTextboxText: false, hasEmojiStar: false };
      try {
        if (!window.docx || typeof window.docx.renderAsync !== 'function') throw new Error('docx-preview 全局对象缺失');
        const bin = atob(window.__docxData);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        if (!window.flattenManualTextboxes) throw new Error('manual_textbox_flat.js 未加载');
        const flattened = await window.flattenManualTextboxes(blob);
        await window.docx.renderAsync(flattened, document.getElementById('container'), null, {});
        const docxEl = document.querySelector('#container .docx-wrapper > .docx') || document.querySelector('#container .docx-wrapper');
        out.sections = document.querySelectorAll('#container section.docx').length;
        out.paras = document.querySelectorAll('#container p').length;
        out.tables = document.querySelectorAll('#container table').length;
        out.images = document.querySelectorAll('#container img').length;
        out.hasDocx = !!docxEl;
        const text = document.getElementById('container').innerText || '';
        out.hasTextboxText = text.includes('开始前的说明（重要）') && text.includes('本软件内没有可以直接创作/编辑谱面文件的功能。');
        out.hasEmojiStar = text.includes('星标的独特条目（⭐）');
        out.baseWidth = docxEl ? docxEl.offsetWidth : 0;
        // 校验 CSS zoom 缩放对布局宽度生效（manual.js 的缩放机制）
        document.getElementById('container').style.zoom = '1.25';
        out.zoom = docxEl ? docxEl.offsetWidth : 0;
        document.getElementById('container').style.zoom = '';
        out.ok = out.sections > 0 && out.paras > 0 && out.hasTextboxText && out.hasEmojiStar;
      } catch (e) {
        out.error = String(e && (e.stack || e.message) || e);
      }
      return out;
    };
  </script>
</body>
</html>
