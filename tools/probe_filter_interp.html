<!doctype html>
<html>
<head><meta charset="utf-8"><title>filter interp probe</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  try {
    const out = { checks: [], ok: true };
    const check = (name, cond, detail) => {
      out.checks.push({ name, pass: !!cond, detail: String(detail) });
      if (!cond) out.ok = false;
    };
    const c = document.createElement('canvas');
    c.width = 960; c.height = 540;
    const pv = new window.SBPreview.PreviewRenderer(c);
    pv.chart = new window.SBEngine.chart.Chart(JSON.stringify({
      format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
      page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
      note_list: []
    }), { screenRatio: 16 / 9 });
    pv.compiled = new window.SBEngine.storyboard.StoryboardCompiler({
      controllers: [{
        id: 'fx',
        bloom_intensity: 0, fisheye_intensity: 0, radial_blur_intensity: 0,
        states: [
          { time: 0 },
          { time: 1, bloom_intensity: 2, fisheye_intensity: 1, radial_blur_intensity: 0.1, easing: 'linear' },
          { time: 2, bloom_intensity: 2, fisheye_intensity: 1, radial_blur_intensity: 0.1 },
        ],
      }],
    }, pv.chart).compile();
    const sample = (t) => {
      pv.time = t;
      pv.evaluate(t);
      return {
        bloom: pv.mergedCtrl && pv.mergedCtrl.bloom_intensity,
        fish: pv.mergedCtrl && pv.mergedCtrl.fisheye_intensity,
        radial: pv.mergedCtrl && pv.mergedCtrl.radial_blur_intensity,
      };
    };
    const at05 = sample(0.5); // halfway 0 -> 2 linear => 1
    const at15 = sample(1.5); // after the 0->1 transition, at 2/1/0.1
    out.samples = { at05, at15 };
    check('bloom_intensity interpolates 0->2 (t=0.5 => 1)',
      at05.bloom != null && Math.abs(at05.bloom - 1) < 1e-6, `bloom=${at05.bloom}`);
    check('fisheye_intensity interpolates 0->1 (t=0.5 => 0.5)',
      at05.fish != null && Math.abs(at05.fish - 0.5) < 1e-6, `fish=${at05.fish}`);
    check('radial_blur_intensity interpolates 0->0.1 (t=0.5 => 0.05)',
      at05.radial != null && Math.abs(at05.radial - 0.05) < 1e-6, `radial=${at05.radial}`);
    check('values hold steady after transition (t=1.5)',
      at15.bloom === 2 && at15.fish === 1 && at15.radial === 0.1,
      `bloom=${at15.bloom} fish=${at15.fish} radial=${at15.radial}`);
    fs.writeFileSync(path.join(__dirname, 'probe_filter_interp_out.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'probe_filter_interp_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
