<!doctype html>
<html>
<head><meta charset="utf-8"><title>fx exact GL port test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/renderer/effects.js"></script>
<script>
  try {
    const W = 320, H = 180;
    const mk = (fill) => {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      if (fill) fill(ctx);
      return { c, ctx };
    };
    const snap = (ctx) => ctx.getImageData(0, 0, W, H).data;
    const diff = (a, b) => {
      let sum = 0, n = 0;
      for (let i = 0; i < a.length; i += 7) { sum += Math.abs(a[i] - b[i]); n++; }
      return +(n ? sum / n : 0).toFixed(3);
    };
    const px = (ctx, x, y) => {
      const d = ctx.getImageData(x, y, 1, 1).data;
      return [d[0], d[1], d[2]];
    };
    const gray = (ctx) => { ctx.fillStyle = '#7f7f7f'; ctx.fillRect(0, 0, W, H); };
    const colorful = (ctx) => {
      ctx.fillStyle = '#e33'; ctx.fillRect(0, 0, W / 2, H / 2);
      ctx.fillStyle = '#3e3'; ctx.fillRect(W / 2, 0, W / 2, H / 2);
      ctx.fillStyle = '#33e'; ctx.fillRect(0, H / 2, W / 2, H / 2);
      ctx.fillStyle = '#ee3'; ctx.fillRect(W / 2, H / 2, W / 2, H / 2);
    };
    const run = (eff, setup) => {
      const { c, ctx } = mk(setup || gray);
      const before = c.toDataURL();
      window.SBEffects.applyEffects(ctx, c, W, H, eff, 1.23, true);
      return { glUsed: window.SBGlUsed, changed: before !== c.toDataURL(), ctx };
    };

    const out = { smoke: {}, math: {} };

    // 1. Every one of the 16 filters runs on GL and changes the image.
    const filters = [
      ['arcade', { arcade: true, arcade_intensity: 1, arcade_interference_size: 1, arcade_interference_speed: 0.5, arcade_contrast: 1 }],
      ['artifact', { artifact: true, artifact_intensity: 1, artifact_colorisation: 1, artifact_parasite: 1, artifact_noise: 1 }],
      ['chromatical', { chromatical: true, chromatical_intensity: 1, chromatical_fade: 1, chromatical_speed: 1 }],
      ['color_adjustment', { color_adjustment: true, brightness: 1.5, saturation: 1, contrast: 1 }],
      ['color_filter', { color_filter: true, color_filter_color: { r: 1, g: 0, b: 0, a: 1 } }],
      ['dream', { dream: true, dream_intensity: 1 }],
      ['fisheye', { fisheye: true, fisheye_intensity: 0.9 }],
      ['focus', { focus: true, focus_intensity: 0.25, focus_size: 1, focus_speed: 5, focus_color: { r: 1, g: 1, b: 1, a: 1 } }],
      ['glitch', { glitch: true, glitch_intensity: 1 }],
      ['gray_scale', { gray_scale: true, gray_scale_intensity: 1 }],
      ['noise', { noise: true, noise_intensity: 0.5 }],
      ['radial_blur', { radial_blur: true, radial_blur_intensity: 0.3 }],
      ['sepia', { sepia: true, sepia_intensity: 1 }],
      ['shockwave', { shockwave: true, shockwave_speed: 1 }],
      ['tape', { tape: true }],
      ['bloom', { bloom: true, bloom_intensity: 2 }],
    ];
    for (const [name, eff] of filters) {
      const r = run(eff, colorful);
      out.smoke[name] = { glUsed: r.glUsed, changed: r.changed };
    }

    // 2. Neutral points: fisheye 0.5 and arcade intensity 0 are identity.
    {
      const r1 = run({ fisheye: true, fisheye_intensity: 0.5 });
      out.math.fisheyeNeutral = { glUsed: r1.glUsed, changed: r1.changed };
      const r2 = run({ arcade: true, arcade_intensity: 0 });
      out.math.arcadeZero = { glUsed: r2.glUsed, changed: r2.changed };
    }

    // 3. Exact color math on rgb(120,80,40):
    //    gray luma = 0.222*120 + 0.707*80 + 0.071*40 = 86.0
    //    sepia = gray + (0.437,0.171,0.078)*255 = (197.5, 129.7, 105.9)
    //    brightness 1.5 on gray 100 -> 150
    {
      const col = (ctx) => { ctx.fillStyle = 'rgb(120,80,40)'; ctx.fillRect(0, 0, W, H); };
      let r = run({ gray_scale: true, gray_scale_intensity: 1 }, col);
      out.math.gray = px(r.ctx, W / 2, H / 2);
      r = run({ sepia: true, sepia_intensity: 1 }, col);
      out.math.sepia = px(r.ctx, W / 2, H / 2);
      const col2 = (ctx) => { ctx.fillStyle = 'rgb(100,100,100)'; ctx.fillRect(0, 0, W, H); };
      r = run({ color_adjustment: true, brightness: 1.5, saturation: 1, contrast: 1 }, col2);
      out.math.brightness = px(r.ctx, W / 2, H / 2);
      r = run({ color_filter: true, color_filter_color: { r: 1, g: 0, b: 0, a: 1 } }, col);
      out.math.redFilter = px(r.ctx, W / 2, H / 2);
    }

    // 4. Noise is time-independent (no _TimeX in the shader).
    {
      const a = run({ noise: true, noise_intensity: 0.6 }, colorful);
      const b = run({ noise: true, noise_intensity: 0.6 }, colorful);
      const same = snap(a.ctx).join(',') === snap(b.ctx).join(',');
      out.math.noiseTimeStatic = { same, glUsed: a.glUsed };
    }

    // 5. Radial blur: a center dot smears outward along the ray.
    {
      const dot = (ctx) => { ctx.fillStyle = '#fff'; ctx.fillRect(W / 2, H / 2, 2, 2); };
      const r = run({ radial_blur: true, radial_blur_intensity: 0.8 }, dot);
      const d = r.ctx.getImageData(0, 0, W, H).data;
      let lit = 0, minX = W, maxX = 0, minY = H, maxY = 0;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (d[(y * W + x) * 4] > 25) {
            lit++;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      out.math.radial = { lit, spanX: maxX - minX + 1, spanY: maxY - minY + 1 };
    }

    // 6. Bloom: white square gets a glow (GL chain runs).
    {
      const sq = (ctx) => { ctx.fillStyle = '#fff'; ctx.fillRect(W * 0.35, H * 0.35, W * 0.3, H * 0.3); };
      const base = run({}, sq);
      const bloom = run({ bloom: true, bloom_intensity: 2 }, sq);
      out.math.bloom = { changed: bloom.changed, glUsed: bloom.glUsed, diff: diff(snap(base.ctx), snap(bloom.ctx)) };
    }

    // 7. Tape is a rolling flip: fract(uv.y + time).
    {
      const strip = (ctx) => {
        for (let y = 0; y < H; y++) {
          const v = Math.round(y / (H - 1) * 255);
          ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
          ctx.fillRect(0, y, W, 1);
        }
      };
      const r = run({ tape: true }, strip);
      const d = r.ctx.getImageData(0, 0, W, H).data;
      const t = 1.23, frac = t - Math.floor(t);
      const dst = d[(Math.floor(H / 2) * W + Math.floor(W / 2)) * 4];
      // Screen row y maps to GL v = 1 - y/H; the shader samples v' =
      // fract(v + t), which is the source canvas row (1 - v') * H.
      const v = 1 - (H / 2) / H;
      const vp = (v + frac) - Math.floor(v + frac);
      const srcRow = Math.round((1 - vp) * (H - 1));
      const src = Math.round(srcRow / (H - 1) * 255);
      out.math.tape = { dst, src, diff: Math.abs(dst - src) };
    }

    fs.writeFileSync(path.join(__dirname, 'probe_fx_exact_out.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'probe_fx_exact_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
