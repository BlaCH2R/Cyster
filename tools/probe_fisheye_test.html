<!doctype html>
<html>
<head><meta charset="utf-8"><title>fisheye neutral-point test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
  const mode = new URLSearchParams(location.search).get('mode') || 'gl';
</script>
<script src="../app/src/renderer/effects.js"></script>
<script>
  try {
    if (mode === '2d') {
      // Force WebGL unavailable BEFORE any apply call so the 2D fallback runs.
      const origGet = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type) {
        if (String(type).indexOf('webgl') >= 0) return null;
        return origGet.apply(this, arguments);
      };
    }
    const W = 320, H = 180;
    function mkCanvas() {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      // Gray background so the red probe dot is easy to locate.
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, W, H);
      const dotX = Math.round(0.75 * W), dotY = Math.round(0.5 * H);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(dotX - 2, dotY - 2, 5, 5);
      return { c, ctx, dotX, dotY };
    }
    function dotPos(ctx) {
      const d = ctx.getImageData(0, 0, W, H).data;
      let best = -1, bestX = -1;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const red = d[i] - (d[i + 1] + d[i + 2]) / 2;
          if (red > best) { best = red; bestX = x; }
        }
      }
      return bestX;
    }
    function samePixels(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i += 4) {
        if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2]) return false;
      }
      return true;
    }
    function run(eff) {
      const { c, ctx, dotX, dotY } = mkCanvas();
      const before = ctx.getImageData(0, 0, W, H).data;
      window.SBEffects.applyEffects(ctx, c, W, H, { fisheye: true, fisheye_intensity: eff }, 1.5);
      const after = ctx.getImageData(0, 0, W, H).data;
      return {
        unchanged: samePixels(before, after),
        dotX: dotPos(ctx),
        origDotX: dotX,
        glUsed: window.SBGlUsed,
      };
    }
    const out = {
      mode,
      neutral: run(0.5),
      barrel: run(1.0),
      pincushion: run(0.0),
    };
    fs.writeFileSync(path.join(__dirname, 'probe_fisheye_out_' + mode + '.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'probe_fisheye_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
