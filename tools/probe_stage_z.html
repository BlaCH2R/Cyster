<!doctype html>
<html>
<head><meta charset="utf-8"><title>stage z probe</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  (async () => {
    try {
      const out = { checks: [], ok: true };
      const check = (name, cond, detail) => {
        out.checks.push({ name, pass: !!cond, detail: String(detail) });
        if (!cond) out.ok = false;
      };
      const W = 960, H = 540;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const pv = new window.SBPreview.PreviewRenderer(canvas);
      pv.chart = new window.SBEngine.chart.Chart(JSON.stringify({
        format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
        page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
        note_list: []
      }), { screenRatio: 16 / 9 });
      pv.mergedCtrl = { perspective: true, fov: 53.2, size: 5, zPx: -10, xPx: 0, yPx: 0, rot_x: 0, rot_y: 0, rot_z: 0 };
      const info = pv.ctxInfo();

      // Unit conversions (engine GenericStateParser, scaleToCanvas=true).
      const cases = [
        ['world z=300', { value: 300, unit: 'world' }, 300],
        ['stagex z=300', { value: 300, unit: 'stagex' }, 300],
        ['stagey z=300', { value: 300, unit: 'stagey' }, 300],
        ['camerax z=0.375', { value: 0.375, unit: 'camerax' }, 300],
        ['cameray z=0.5', { value: 0.5, unit: 'cameray' }, 300],
      ];
      for (const [name, u, expect] of cases) {
        const got = pv.stageZPx(u, info);
        out[name] = got;
        check(name, Math.abs(got - expect) < 1e-6, `got=${got} expected=${expect}`);
      }
      // notex/notey go through the chart field conversion (world -> canvas).
      const nx = pv.stageZPx({ value: 0.5, unit: 'notex' }, info);
      const nxExpect = pv.chart.convertChartXToScreenX(0.5) / (2 * 5 * (W / H)) * 800;
      out.notex = nx;
      check('notex z=0.5 converts via chart field', Math.abs(nx - nxExpect) < 1e-6, `got=${nx} expected=${nxExpect}`);
      const ny = pv.stageZPx({ value: 0.5, unit: 'notey' }, info);
      const nyExpect = pv.chart.convertChartYToScreenY(0.5) / (2 * 5) * 600;
      out.notey = ny;
      check('notey z=0.5 converts via chart field', Math.abs(ny - nyExpect) < 1e-6, `got=${ny} expected=${nyExpect}`);

      // Render equivalence is covered by the engine comparison (parent_rot
      // z sprites): the same z px value goes through the same unchanged
      // projection, so identical stageZPx values render identically.

      fs.writeFileSync(path.join(__dirname, 'probe_stage_z_out.json'), JSON.stringify(out, null, 2));
      window.close();
    } catch (e) {
      fs.writeFileSync(path.join(__dirname, 'probe_stage_z_err.txt'), String(e && e.stack || e));
      window.close();
    }
  })();
</script>
</body>
</html>
