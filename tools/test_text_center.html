<!doctype html>
<html>
<head><meta charset="utf-8"><title>text center test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/json.js"></script>
<script src="../app/src/engine/easing.js"></script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  try {
    const out = { checks: [], ok: true };
    const W = 640, H = 360;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const pv = new window.SBPreview.PreviewRenderer(c);
    pv.chart = new window.SBEngine.chart.Chart(JSON.stringify({
      format_version: 0, time_base: 480, start_offset_time: 0, music_offset: 0,
      page_list: [{ start_tick: 0, end_tick: 960, scan_line_direction: -1 }],
      note_list: [],
    }), { screenRatio: 16 / 9 });
    const check = (name, cond, detail) => {
      out.checks.push({ name, pass: !!cond, detail });
      if (!cond) out.ok = false;
    };

    const compiled = new window.SBEngine.storyboard.StoryboardCompiler({
      texts: [{
        id: 't1',
        states: [{ time: 0, opacity: 1, text: 'Hello', size: 40, align: 'middleCenter' }],
      }],
    }, pv.chart).compile();
    pv.compiled = compiled;
    pv.mergedCtrl = {};
    pv.evaluate(0.5);
    const r = pv.evalResult.texts.find((x) => x.obj.id === 't1');
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    pv.drawStageObject(ctx, pv.ctxInfo(), r, 'text', 1);

    // Find the drawn text pixels' vertical extent (white text on black).
    const img = ctx.getImageData(0, 0, W, H).data;
    let minY = -1, maxY = -1;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        if (img[i] > 80) {
          if (minY < 0) minY = y;
          maxY = y;
        }
      }
    }
    const center = (minY + maxY) / 2;
    out.text = { minY, maxY, center, Hmid: H / 2, offset: center - H / 2 };
    // Default centered text must be vertically centered on the canvas (within
    // a few px - the old code was off by ~0.6 * font size = 24px).
    check('default text is vertically centered', Math.abs(center - H / 2) < 8,
      `center=${center.toFixed(1)} Hmid=${H / 2} offset=${(center - H / 2).toFixed(1)}`);

    fs.writeFileSync(path.join(__dirname, 'test_text_center_out.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'test_text_center_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
