<!doctype html>
<html>
<head><meta charset="utf-8"><title>event text layer order test</title></head>
<body>
<script>
  const fs = require('fs');
  const path = require('path');
</script>
<script src="../app/src/engine/storyboard.js"></script>
<script src="../app/src/engine/chart.js"></script>
<script src="../app/src/engine/colors.js"></script>
<script src="../app/src/renderer/preview.js"></script>
<script>
  try {
    const out = { checks: [], ok: true };
    const check = (name, cond, detail) => {
      out.checks.push({ name, pass: !!cond, detail });
      if (!cond) out.ok = false;
    };

    const c = document.createElement('canvas');
    c.width = 960; c.height = 540;
    const pv = new window.SBPreview.PreviewRenderer(c);
    pv.compiled = null;   // evaluate() -> mergedCtrl = {}
    pv._dirty = true;
    pv.time = 0;
    pv.playing = false;
    pv.effectsEnabled = false;

    const order = [];
    const record = (name) => (...args) =>
      order.push(name + (name === 'drawStageLayer' ? ':' + args[2] : ''));
    pv.drawBackground = record('drawBackground');
    pv.drawStageLayer = record('drawStageLayer');
    pv.drawWorld = record('drawWorld');
    pv.drawEventPresentation = record('drawEventPresentation');
    pv.drawUI = record('drawUI');
    pv.drawSelectionHighlight = record('drawSelectionHighlight');

    pv.render();

    const expected = [
      'drawBackground',
      'drawStageLayer:0',
      'drawStageLayer:1',
      'drawEventPresentation',
      'drawWorld',
      'drawStageLayer:2',
      'drawUI',
      'drawSelectionHighlight'
    ];
    check('render call order matches required layering', JSON.stringify(order) === JSON.stringify(expected),
      'got=' + JSON.stringify(order));

    const iText = order.indexOf('drawEventPresentation');
    const iNotes = order.indexOf('drawWorld');
    const iL0 = order.indexOf('drawStageLayer:0');
    const iL1 = order.indexOf('drawStageLayer:1');
    check('event text drawn after layer 0', iText > iL0);
    check('event text drawn after layer 1', iText > iL1);
    check('event text drawn before notes', iText < iNotes);

    fs.writeFileSync(path.join(__dirname, 'probe_event_text_layer_out.json'), JSON.stringify(out, null, 2));
    window.close();
  } catch (e) {
    fs.writeFileSync(path.join(__dirname, 'probe_event_text_layer_err.txt'), String(e && e.stack || e));
    window.close();
  }
</script>
</body>
</html>
